<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="apple-touch-icon" href="icons/admin-180.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@600&family=Mukta:wght@400;600;800&display=swap">
<style>
:root{--bg:#0e1410;--card:#18231c;--card2:#1f2c23;--line:#2b3b30;--ink:#eef4ee;--muted:#9fb3a5;--green:#3fcf5e;--gold:#f2b705;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mukta','Noto Sans Devanagari',system-ui,sans-serif;font-size:15px;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:rgba(14,20,16,.95);border-bottom:1px solid var(--line)}
header .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
header img{width:36px;height:36px;border-radius:50%;border:2px solid var(--gold)}
header b{font-family:'Teko',sans-serif;font-size:26px;color:var(--gold);line-height:1}
header .sp{flex:1}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;white-space:nowrap}.tbl th{color:var(--gold);font-size:13px}.tbl a{color:inherit}
.tabs{max-width:860px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px}
.tabs button{flex:none;background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--gold);color:#111;border-color:var(--gold)}
main{max-width:860px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
h2{margin:0 0 6px;font-size:20px}
h3{margin:0 0 6px;font-size:16px;color:var(--gold)}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:8px 0 3px}
input,textarea,select{width:100%;background:#0b110d;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 10px;font:inherit}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.btn{white-space:nowrap;background:var(--green);color:#06210e;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:800;cursor:pointer}
.btn.gold{background:var(--gold);color:#111}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.red{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5}
.muted{color:var(--muted)}.small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-family:'Teko',sans-serif;font-size:38px;color:var(--gold);line-height:1}
.stat span{font-size:13px;color:var(--muted)}
.item{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.qlist .q{border-top:1px solid var(--line);padding:8px 0;display:flex;gap:8px;align-items:flex-start}
.qlist .q div{flex:1;min-width:0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;border:1px solid var(--gold);color:var(--ink);padding:10px 16px;border-radius:12px;z-index:50;max-width:92vw;display:none}
.warn{background:#2a2205;border:1px solid #5a4700;border-radius:10px;padding:8px 10px;font-size:13px}
ol{padding-left:20px;margin:6px 0}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:8px}
.bars div{flex:1;background:var(--green);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.bars div span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.blabels{display:flex;gap:4px}.blabels span{flex:1;text-align:center;font-size:10px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="in"><img src="icons/logo.png" alt=""><div><b>Agrikranti Admin</b><div class="muted small">सिर्फ आपके लिए</div></div><div class="sp"></div><a class="btn ghost small" href="./" target="_blank" style="text-decoration:none">App खोलें</a><button class="btn small" id="inst" hidden>📲 App Install</button> <button class="btn ghost small" id="logout" hidden>Logout</button></div>
<nav class="tabs" id="tabs" hidden></nav></header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script src="akcrypto.js"></script>
<script>
var OWNER='kumarvsaditya-droid', REPO='Agrikranti', BRANCHES=['main','gh-pages'];
var STATS_NS='agrikranti1928-app', STATS_API='https://abacus.jasoncameron.dev';
var TOKEN=null, C=null, TESTS=null, TAB='dash', PINK=null;
var M=document.getElementById('main');

function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(t,ms){ var x=document.getElementById('toast'); x.textContent=t; x.style.display='block'; clearTimeout(x._t); x._t=setTimeout(function(){ x.style.display='none'; },ms||3500); }
function b64(str){ var bytes=new TextEncoder().encode(str), bin=''; for(var i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192)); return btoa(bin); }
function unb64(s){ var bin=atob(s.replace(/\n/g,'')), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new TextDecoder().decode(a); }

/* ---------- GitHub ---------- */
function gh(path,opt){
  opt=opt||{}; opt.headers=Object.assign({'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json'},opt.headers||{});
  return fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+path,opt).then(function(r){
    if(r.status===404) return null;
    return r.json().then(function(j){ if(!r.ok) throw new Error(j.message||('Error '+r.status)); return j; });
  });
}
function readFile(path){ return gh('/contents/'+path+'?ref=main&t='+Date.now()).then(function(j){ return j?unb64(j.content):null; }); }
function putOne(path,contentB64,msg,branch){
  return gh('/contents/'+path+'?ref='+branch+'&t='+Date.now()).then(function(cur){
    var body={message:msg,content:contentB64,branch:branch}; if(cur&&cur.sha) body.sha=cur.sha;
    return gh('/contents/'+path,{method:'PUT',body:JSON.stringify(body)}).then(function(r){ if(!r) throw new Error('Token में "Contents: Read and write" permission नहीं है (नया token बनाएं)'); return r; });
  }).catch(function(e){ if(/not accessible|permission|403|Resource/i.test(e.message)) throw new Error('Token में "Contents: Read and write" permission नहीं है - GitHub में token edit करके Contents को Read and write करें'); throw e; });
}
function putFile(path,contentB64,msg){
  return BRANCHES.reduce(function(p,br){ return p.then(function(){ return putOne(path,contentB64,msg,br); }); },Promise.resolve());
}
function saveContent(msg,quiet){
  if(C.config.geminiKey!==undefined){ C.config.gk=C.config.geminiKey?btoa(C.config.geminiKey.split('').reverse().join('')):''; delete C.config.geminiKey; }
  toast('Save हो रहा है...',20000);
  return putFile('content.json',b64(JSON.stringify(C,null,1)),'Admin: '+msg).then(function(){ toast('✅ Save हो गया। 1 - 2 मिनट में पूरे app में दिखेगा।',6000); })
    .catch(function(e){ if(!quiet){ toast('❌ Save नहीं हुआ: '+e.message,12000); alert('Save नहीं हुआ: '+e.message); } throw e; });
}
function saveTests(msg){
  toast('Tests save हो रहे हैं...',20000);
  var js='/* Agrikranti - Test Series data (Admin panel se update) */\nwindow.TESTS = '+JSON.stringify(TESTS)+';\n';
  return putFile('tests.js',b64(js),'Admin: '+msg).then(function(){ toast('✅ Tests save हो गए। 1 - 2 मिनट में app में दिखेंगे।',6000); })
    .catch(function(e){ toast('❌ Save नहीं हुआ: '+e.message,8000); });
}
function uploadPdf(file,folder){
  return new Promise(function(res,rej){
    if(!file) return res(null);
    if(file.size>45*1024*1024) return rej(new Error('PDF 45 MB से छोटी होनी चाहिए'));
    var safe=file.name.replace(/[^A-Za-z0-9._-]+/g,'_'), path=folder+'/'+safe, fr=new FileReader();
    fr.onload=function(){ var b=fr.result.split(',')[1]; toast('PDF upload हो रही है... ('+Math.round(file.size/1024)+' KB)',60000);
      putFile(path,b,'Admin: upload '+safe).then(function(){ res(path); }).catch(rej); };
    fr.onerror=function(){ rej(new Error('File पढ़ी नहीं जा सकी')); };
    fr.readAsDataURL(file);
  });
}

/* ---------- Login ---------- */
function loginView(msg){
  document.getElementById('tabs').hidden=true; document.getElementById('logout').hidden=true;
  M.innerHTML='<div class="card"><h2>Admin Login</h2><p class="muted small">यह पेज सिर्फ आपके लिए है। GitHub का "Access Token" एक बार डालें, यह इसी फोन/browser में याद रहेगा।</p>'
   +(msg?'<div class="warn" style="border-color:var(--bad)">'+esc(msg)+'</div>':'')
   +'<label>GitHub Access Token</label><input id="tk" type="password" placeholder="github_pat_..." autocomplete="off"><div class="row" style="margin-top:10px"><button class="btn" id="go">Login</button></div></div>'
   +'<div class="card"><h3>Token कैसे बनाएं (सिर्फ एक बार)</h3><ol class="small">'
   +'<li>Chrome में <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a> खोलें (अपने GitHub account से login रहें)।</li>'
   +'<li><b>Token name:</b> कोई भी नया नाम, जैसे Agrikranti Admin 2 ("already been taken" आए तो नाम के आगे कोई नंबर बदल दें)। <b>Expiration:</b> 1 year।</li>'
   +'<li><b>Repository access:</b> "Only select repositories" चुनें → <b>Agrikranti</b> चुनें।</li>'
   +'<li><b>Permissions</b> → Repository permissions → <b>Contents</b> को "Read and write" करें।</li>'
   +'<li>नीचे <b>Generate token</b> दबाएं, जो token दिखे (github_pat_ से शुरू) उसे copy करके ऊपर डालें।</li></ol>'
   +'<p class="muted small">Token किसी को न भेजें। फोन खो जाए तो GitHub में जाकर token delete कर दें।</p></div>';
  document.getElementById('go').onclick=function(){ var t=document.getElementById('tk').value.trim(); if(!t) return; TOKEN=t; boot(true); };
}
function boot(fresh){
  M.innerHTML='<div class="card muted">लोड हो रहा है...</div>';
  gh('').then(function(repo){
    if(!repo) throw new Error('Repository नहीं मिली। Token में Agrikranti repo चुनी है?');
    if(repo.permissions && !repo.permissions.push) throw new Error('Token में "Contents: Read and write" permission नहीं है।');
    return Promise.all([readFile('content.json'),readFile('tests.js')]);
  }).then(function(r){
    C=JSON.parse(r[0]); var t=r[1]; TESTS=JSON.parse(t.slice(t.indexOf('['),t.lastIndexOf(']')+1));
    if(fresh) ls('ak_admin_token',TOKEN);
    document.getElementById('tabs').hidden=false; document.getElementById('logout').hidden=false;
    renderTabs(); show(TAB);
  }).catch(function(e){ ls('ak_admin_token',null); TOKEN=null; loginView('Login नहीं हुआ: '+e.message); });
}
document.getElementById('logout').onclick=function(){ ls('ak_admin_token',null); TOKEN=null; loginView(); };

/* ---------- Tabs ---------- */
var TABS=[['dash','🏠 Dashboard'],['students','👥 Students'],['buyers','🧾 खरीदार'],['sales','💰 eBook बिक्री'],['banners','🖼️ Banners'],['notice','📢 सूचना'],['semester','🎓 Semester'],['ebooks','📚 eBooks'],['tests','📝 Tests'],['stats','📊 Stats'],['settings','⚙️ Settings'],['backup','💾 Backup'],['help','❓ मदद']];
function renderTabs(){ var n=document.getElementById('tabs'); n.innerHTML=TABS.map(function(t){ return '<button data-t="'+t[0]+'" class="'+(t[0]===TAB?'on':'')+'">'+t[1]+'</button>'; }).join('');
  n.querySelectorAll('button').forEach(function(b){ b.onclick=function(){ TAB=b.getAttribute('data-t'); renderTabs(); show(TAB); }; }); }
function show(t){ window.scrollTo(0,0); ({dash:dashView,banners:bannersView,backup:backupView,help:helpView,students:studentsView,buyers:buyersView,sales:salesView,stats:statsView,notice:noticeView,semester:semView,ebooks:ebookView,tests:testsView,settings:settingsView}[t])(); }

/* ---------- Stats ---------- */
function getCount(key){ return fetch(STATS_API+'/get/'+STATS_NS+'/'+key).then(function(r){ return r.ok?r.json():{value:0}; }).then(function(j){ return j.value||0; }).catch(function(){ return null; }); }
function statsView(){
  var keys=[['users','कुल लोग (अलग-अलग फोन)'],['installs','App Install किया'],['opens','App कितनी बार खुला'],['tests-submitted','Test submit हुए'],['pdf-opens','PDF खोली / download'],['buy-clicks','eBook "खरीदें" दबाया'],['ai-questions','Ask AI में प्रश्न पूछे']];
  var days=[]; for(var i=13;i>=0;i--){ var d=new Date(Date.now()-i*864e5); days.push(d.toISOString().slice(0,10)); }
  M.innerHTML='<div class="card"><h2>App Stats</h2><div class="stats" id="st">'+keys.map(function(k){ return '<div class="stat"><b id="s-'+k[0]+'">…</b><span>'+k[1]+'</span></div>'; }).join('')+'</div>'
   +'<h3 style="margin-top:14px">पिछले 14 दिन - रोज़ कितने लोगों ने app खोला</h3><div class="bars" id="bars"></div><div class="blabels">'+days.map(function(d){ return '<span>'+d.slice(8)+'</span>'; }).join('')+'</div>'
   +'<div class="row" style="margin-top:12px"><button class="btn ghost" id="rf">Refresh</button></div>'
   +'<p class="muted small">गिनती इस update (6 Nov 2026) के बाद से शुरू हुई है। एक फोन एक बार ही "कुल लोग" में गिना जाता है (browser data साफ करने पर दोबारा गिना जा सकता है)। "Install" तब गिना जाता है जब student app को home screen पर install करके खोलता है।</p></div>';
  keys.forEach(function(k){ getCount(k[0]).then(function(v){ var el=document.getElementById('s-'+k[0]); if(el) el.textContent=v==null?'-':v; }); });
  Promise.all(days.map(function(d){ return getCount('day-'+d); })).then(function(v){ var mx=Math.max.apply(null,v.map(function(x){return x||0;}).concat([1]));
    var bz=document.getElementById('bars'); if(bz) bz.innerHTML=v.map(function(x){ x=x||0; return '<div style="height:'+Math.round(x/mx*100)+'%"><span>'+x+'</span></div>'; }).join(''); });
  document.getElementById('rf').onclick=statsView;
}

/* ---------- Notice ---------- */
function noticeView(){
  var n=C.notice||{};
  M.innerHTML='<div class="card"><h2>Home पर सूचना (Notice)</h2><p class="muted small">यहाँ लिखा संदेश app के Home page पर सबसे ऊपर दिखेगा। खाली छोड़ें तो नहीं दिखेगा।</p>'
   +'<label>संदेश</label><textarea id="nt" placeholder="जैसे: नया Test 11 आ गया है! / Semester exam 20 Nov से">'+esc(n.text)+'</textarea>'
   +'<div class="grid2"><div><label>Button link (optional)</label><input id="nl" value="'+esc(n.link)+'" placeholder="https://..."></div><div><label>Button का नाम</label><input id="nb" value="'+esc(n.linkText)+'" placeholder="जैसे: Join करें"></div></div>'
   +'<div class="row" style="margin-top:10px"><button class="btn gold" id="sv">Save करें</button><button class="btn red" id="cl">सूचना हटाएं</button></div></div>';
  document.getElementById('sv').onclick=function(){ C.notice={text:document.getElementById('nt').value.trim(),link:document.getElementById('nl').value.trim(),linkText:document.getElementById('nb').value.trim()}; saveContent('notice update'); };
  document.getElementById('cl').onclick=function(){ C.notice={text:'',link:'',linkText:''}; saveContent('notice removed').then(noticeView); };
}

/* ---------- Semester ---------- */
function semView(){
  var h='<div class="card"><h2>B.Sc. Agriculture Semester Papers</h2><p class="muted small">हर semester में subject जोड़ें, question paper और solution की PDF upload करें।</p></div>';
  C.semester.forEach(function(g,gi){
    h+='<div class="card"><div class="row" style="justify-content:space-between"><h3>'+esc(g.title)+'</h3><button class="btn red small" data-dg="'+gi+'">Semester हटाएं</button></div>';
    g.papers.forEach(function(x,pi){
      h+='<div class="item"><b>'+esc(x.code)+' - '+esc(x.subject)+'</b><div class="muted small">'+esc(x.info)+'</div><div class="small" style="margin:4px 0">📄 <a href="'+esc(x.paper)+'" target="_blank">Question Paper</a> · ✅ <a href="'+esc(x.solution)+'" target="_blank">Solution</a></div><div class="row"><button class="btn ghost small" data-ep="'+gi+'-'+pi+'">Edit</button><button class="btn red small" data-dp="'+gi+'-'+pi+'">हटाएं</button></div></div>';
    });
    h+='<button class="btn small" style="margin-top:10px" data-ap="'+gi+'">+ नया Subject Paper जोड़ें</button></div>';
  });
  h+='<div class="card"><h3>नया Semester जोड़ें</h3><div class="grid2"><div><label>Semester नंबर</label><input id="gs" type="number" min="1" max="8" value="'+(C.semester.length+1)+'"></div><div><label>नाम</label><input id="gt" placeholder="B.Sc. Agriculture - 2nd Semester"></div></div><div class="row" style="margin-top:10px"><button class="btn" id="ag">Semester जोड़ें</button></div></div>';
  M.innerHTML=h;
  M.querySelectorAll('[data-dg]').forEach(function(b){ b.onclick=function(){ if(!confirm('यह पूरा semester हटाएं?')) return; C.semester.splice(+b.getAttribute('data-dg'),1); saveContent('semester removed').then(semView); }; });
  M.querySelectorAll('[data-dp]').forEach(function(b){ b.onclick=function(){ var a=b.getAttribute('data-dp').split('-'); if(!confirm('यह paper हटाएं?')) return; C.semester[+a[0]].papers.splice(+a[1],1); saveContent('paper removed').then(semView); }; });
  M.querySelectorAll('[data-ap]').forEach(function(b){ b.onclick=function(){ paperForm(+b.getAttribute('data-ap'),-1); }; });
  M.querySelectorAll('[data-ep]').forEach(function(b){ b.onclick=function(){ var a=b.getAttribute('data-ep').split('-'); paperForm(+a[0],+a[1]); }; });
  document.getElementById('ag').onclick=function(){ var s=+document.getElementById('gs').value||1, t=document.getElementById('gt').value.trim()||('B.Sc. Agriculture - Semester '+s); C.semester.push({sem:s,title:t,papers:[]}); C.semester.sort(function(a,b){return a.sem-b.sem;}); saveContent('semester added').then(semView); };
}
function paperForm(gi,pi){
  var g=C.semester[gi], x=pi>=0?g.papers[pi]:{code:'',subject:'',info:'Model Paper (Previous Year Pattern) · 50 अंक',paper:'',solution:'',pages:''};
  M.innerHTML='<div class="card"><h2>'+(pi>=0?'Paper Edit करें':'नया Paper')+' - '+esc(g.title)+'</h2>'
   +'<div class="grid2"><div><label>Course code</label><input id="pc" value="'+esc(x.code)+'" placeholder="AGR-101"></div><div><label>Subject का नाम</label><input id="ps" value="'+esc(x.subject)+'" placeholder="Fundamentals of Agronomy"></div></div>'
   +'<label>जानकारी (छोटी लाइन)</label><input id="pi" value="'+esc(x.info)+'">'
   +'<label>Solution के पेज</label><input id="pp" type="number" value="'+esc(x.pages)+'">'
   +'<label>Question Paper PDF '+(x.paper?'(अभी: '+esc(x.paper)+' - बदलना हो तो नई चुनें)':'')+'</label><input id="fq" type="file" accept="application/pdf">'
   +'<label>Solution PDF '+(x.solution?'(अभी: '+esc(x.solution)+' - बदलना हो तो नई चुनें)':'')+'</label><input id="fs" type="file" accept="application/pdf">'
   +'<div class="row" style="margin-top:12px"><button class="btn gold" id="sv">Save करें</button><button class="btn ghost" id="bk">वापस</button></div></div>';
  document.getElementById('bk').onclick=semView;
  document.getElementById('sv').onclick=function(){
    var btn=this; btn.disabled=true;
    var y={code:document.getElementById('pc').value.trim(),subject:document.getElementById('ps').value.trim(),info:document.getElementById('pi').value.trim(),pages:+document.getElementById('pp').value||0,paper:x.paper,solution:x.solution};
    if(!y.code||!y.subject){ toast('Code और Subject भरें'); btn.disabled=false; return; }

/* Payment script naye paid items ke liye "master" chaabi deti hai (content.json payMasterW, Admin PIN se locked).
   Paid PDF usi chaabi se lock honi chahiye, warna payment ke baad book nahi khulegi. */
function payMasterKey(){
  if(!C.payMasterW||!PINK) return Promise.resolve(null);
  return AK.aesDec(PINK,AK.b64d(C.payMasterW)).then(function(u){
    if(u.length===32) return u;
    var t=new TextDecoder().decode(u).trim(), k=null; try{ k=AK.b64d(t); }catch(e){}
    return (k&&k.length===32)?k:null;
  }).catch(function(){ return null; });
}
/* Har paid item ki apni chaabi = HMAC-SHA256(master, 'item|'+id) - yahi payment server deta hai (v4 aur v5 dono) */
function itemKey(MK,id){ return crypto.subtle.importKey('raw',MK,{name:'HMAC',hash:'SHA-256'},false,['sign']).then(function(k){ return crypto.subtle.sign('HMAC',k,new TextEncoder().encode('item|'+id)); }).then(function(b){ return new Uint8Array(b); }); }

  document.getElementById('sv').onclick=function(){

function parseBulk(txt){
  var lines=txt.replace(/\r/g,'').split('\n'), out=[], cur=null, mode='q';
  var push=function(){ if(cur&&cur.q&&cur.o.length>=2&&cur.a>=0&&cur.a<cur.o.length) out.push({q:cur.q.trim(),o:cur.o.map(function(x){return x.trim();}),a:cur.a,e:(cur.e||'').trim()}); else if(cur&&cur.q) out.bad=(out.bad||0)+1; cur=null; };
  lines.forEach(function(l){ var t=l.trim(); if(!t){ return; }
    var mo=t.match(/^\(?([A-Ea-e])[\).:]\s*(.+)$/), ma=t.match(/^(?:उत्तर|answer|ans|सही उत्तर)\s*[:\-–]?\s*\(?([A-Ea-e])\)?/i), me=t.match(/^(?:व्याख्या|explanation|exp)\s*[:\-–]\s*(.*)$/i), mq=t.match(/^(?:Q\.?\s*)?\d+\s*[\.\)]\s*(.+)$/i);
    if(ma&&cur){ cur.a='ABCDE'.indexOf(ma[1].toUpperCase()); mode='a'; return; }
    if(me&&cur){ cur.e=me[1]; mode='e'; return; }
    if(mo&&cur&&mode!=='e'&&cur.o.length==='ABCDE'.indexOf(mo[1].toUpperCase())){ cur.o.push(mo[2]); mode='o'; return; }
    if(mq||!cur||mode==='a'||mode==='e'&&!cur){ if(mq||!cur||cur.a>=0){ push(); cur={q:mq?mq[1]:t,o:[],a:-1,e:''}; mode='q'; return; } }
    if(mode==='q') cur.q+='\n'+t; else if(mode==='o') cur.o[cur.o.length-1]+=' '+t; else if(mode==='e') cur.e+=' '+t; });
  push(); return out;
}

  document.getElementById('bs').onclick=function(){ if(!parsed.length) return; parsed.forEach(function(q){ t.questions.push(q); }); saveTests('bulk add '+parsed.length+' Q to '+t.id).then(testsView); };
}
function testSettingsForm(){
  var t=TESTS[TI]; if(!t) return;
  M.innerHTML='<div class="card"><h2>⚙️ इस Test की Setting</h2><p class="muted small">'+esc(t.title)+'. खाली छोड़ें तो Settings वाली सामान्य setting लगेगी ('+(C.config.durationMin||60)+' मिनट, '+(C.config.marksPerQ||2)+' अंक, negative '+(C.config.negative||0)+')।</p>'
   +'<div class="grid2"><div><label>समय (मिनट)</label><input id="sd" type="number" value="'+esc(t.dur||'')+'" placeholder="'+(C.config.durationMin||60)+'"></div><div><label>प्रति प्रश्न अंक</label><input id="sm2" type="number" step="0.5" value="'+esc(t.mpq||'')+'" placeholder="'+(C.config.marksPerQ||2)+'"></div></div>'
   +'<div class="grid2"><div><label>Negative marking (जैसे 0.25)</label><input id="sn2" type="number" step="0.25" value="'+esc(t.neg!=null?t.neg:'')+'" placeholder="'+(C.config.negative||0)+'"></div><div><label>प्रश्नों का क्रम</label><select id="sf"><option value="0"'+(t.fixed?'':' selected')+'>हर बार अलग (shuffle)</option><option value="1"'+(t.fixed?' selected':'')+'>असली paper जैसा तय क्रम</option></select></div></div>'
   +'<div class="row" style="margin-top:12px;gap:8px"><button class="btn gold" id="ss">Save</button><button class="btn ghost" id="sx">वापस</button></div></div>';
  document.getElementById('sx').onclick=testsView;
  document.getElementById('ss').onclick=function(){ var d=+document.getElementById('sd').value, m=+document.getElementById('sm2').value, n=document.getElementById('sn2').value;
    if(d>0) t.dur=d; else delete t.dur; if(m>0) t.mpq=m; else delete t.mpq; if(n!=='') t.neg=+n; else delete t.neg; if(document.getElementById('sf').value==='1') t.fixed=true; else delete t.fixed;
    saveTests('settings '+t.id).then(testsView); };
}

/* ---------- Backup & history ---------- */
function backupView(){
  M.innerHTML='<div class="card"><h2>💾 Backup</h2><p class="muted small">पूरे app का data (settings, notice, papers, eBooks list, banners, tests) एक file में download करें। कुछ गलत हो जाए तो इसी file से वापस लगा सकते हैं।</p>'
   +'<div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn gold" id="bk">⬇ Backup download करें</button><label class="btn ghost" style="cursor:pointer">⬆ Backup से वापस लगाएँ<input type="file" id="rs" accept=".json" hidden></label></div></div>'
   +'<div class="card"><h2>🕘 बदलावों का इतिहास</h2><p class="muted small">हर save का record। गलती से कुछ हट गया हो तो पुराने समय वाले version पर वापस जा सकते हैं (सिर्फ content: notice, papers, eBooks, banners, settings)।</p><div id="hl" class="muted small">लोड हो रहा है...</div></div>';
  document.getElementById('bk').onclick=function(){ var data={savedAt:new Date().toISOString(),content:C,tests:TESTS}; var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'})); a.download='Agrikranti_Backup_'+new Date().toISOString().slice(0,10)+'.json'; a.click(); toast('✅ Backup download हो गया'); };
  document.getElementById('rs').onchange=function(e){ var f=e.target.files[0]; if(!f) return; var fr=new FileReader(); fr.onload=function(){ try{ var d=JSON.parse(fr.result); if(!d.content||!d.content.config) throw 0;
      if(!confirm('Backup ('+(d.savedAt||'').slice(0,10)+') वापस लगाएँ? अभी का data इससे बदल जाएगा।')) return;
      C=d.content; var p=saveContent('restore backup'); if(d.tests&&d.tests.length){ TESTS=d.tests; p=p.then(function(){ return saveTests('restore backup tests'); }); } p.then(backupView);
    }catch(x){ toast('❌ यह सही backup file नहीं है',6000); } }; fr.readAsText(f); };
  gh('/commits?path=content.json&per_page=25').then(function(list){ var el=document.getElementById('hl'); if(!el) return; if(!list||!list.length){ el.textContent='कोई इतिहास नहीं।'; return; }
    el.innerHTML=list.map(function(c,i){ var d=new Date(c.commit.author.date); return '<div class="item" style="padding:6px 10px;display:flex;gap:8px;align-items:center"><div style="flex:1"><b>'+esc(niceMsg(c.commit.message))+'</b><div class="muted small">'+d.toLocaleString('hi-IN',{dateStyle:'medium',timeStyle:'short'})+(i===0?' · <b style="color:#8EE05A">अभी यही चालू</b>':'')+'</div></div>'+(i?'<button class="btn ghost small" data-rv="'+c.sha+'">इस पर वापस</button>':'')+'</div>'; }).join('');
    el.querySelectorAll('[data-rv]').forEach(function(b){ b.onclick=function(){ var sha=b.getAttribute('data-rv'); if(!confirm('App का content इस पुराने version पर वापस करें? (Tests पर असर नहीं)')) return;
      toast('पुराना version लाया जा रहा है...',20000); gh('/contents/content.json?ref='+sha).then(function(j){ var old=JSON.parse(unb64(j.content)); old.licenses=C.licenses; old.sales=C.sales; old.bookKeys=C.bookKeys; old.bookPass=C.bookPass; old.bookPassAdmin=C.bookPassAdmin; old.payMasterW=C.payMasterW; C=old; return saveContent('restore '+sha.slice(0,7)); }).then(backupView).catch(function(e){ toast('❌ '+e.message,8000); }); }; }); })
   .catch(function(){ var el=document.getElementById('hl'); if(el) el.textContent='इतिहास नहीं खुला।'; });
}
