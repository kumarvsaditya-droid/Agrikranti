<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1410">
<meta name="description" content="Agrikranti 1928 - Agriculture competitive exam test series, eBooks aur notes">
<title>Agrikranti</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Mukta:wght@400;500;700;800&display=swap">
<style>
/* Agrikranti brand: field-night black, crop green, harvest gold (taken from the channel logo) */
:root{
  --bg:#0e1410; --bg2:#141d17; --card:#18231c; --card2:#1f2c23; --line:#2b3b30;
  --ink:#eef4ee; --muted:#9fb3a5; --green:#3fcf5e; --green-d:#1f8f3a; --gold:#f2b705; --gold-d:#c48f00;
  --ok:#4fd36a; --bad:#ff6b6b; --warn:#f2b705;
  --display:'Teko','Mukta',system-ui,sans-serif; --body:'Mukta','Noto Sans Devanagari',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
a{color:var(--gold)}
button{font:inherit}
.app{min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.page{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
/* top bar */
.topbar{position:sticky;top:0;z-index:10;background:rgba(14,20,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar .in{max-width:720px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.topbar img{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold)}
.brand{font-family:var(--display);font-size:28px;line-height:1;letter-spacing:.5px;color:var(--gold)}
.brand small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.topbar .sp{flex:1}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:700;font-size:14px}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{background:none;border:0;color:var(--muted);padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;cursor:pointer}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--gold)}
/* blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.hero{background:radial-gradient(120% 140% at 0% 0%,#1d3a22 0%,var(--card) 55%);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center}
.hero img{width:86px;height:86px;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--gold),0 0 22px rgba(63,207,94,.35)}
.hero h1{font-family:var(--display);font-size:34px;line-height:.95;margin:0;color:var(--gold);letter-spacing:.5px}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
h2.sec{font-family:var(--display);font-size:26px;line-height:1;margin:6px 0 0;letter-spacing:.4px}
h2.sec span{color:var(--green)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{appearance:none;border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;min-height:46px;background:var(--green);color:#06210e}
.btn.gold{background:var(--gold);color:#241a00}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav button:focus-visible,.opt:focus-visible,.pal button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stat{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tcard{display:flex;gap:12px;align-items:flex-start}
.tnum{flex:none;width:52px;height:52px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:30px;color:var(--gold);line-height:1}
.tcard h3{margin:0;font-size:16px;line-height:1.35}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{background:var(--card2);color:var(--muted);border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700}
.chip.done{background:rgba(63,207,94,.15);color:var(--green)}
.link{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.link .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.link b{display:block}
.yt{background:#ff0033}.tg{background:#2aa1da}.wa{background:#1fae54}.ig{background:linear-gradient(45deg,#f9a825,#e91e63,#7b1fa2)}
label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
input{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);color:var(--ink);font:inherit}
.err{color:var(--bad);font-weight:700;font-size:14px;min-height:1.2em}
.okmsg{color:var(--ok);font-weight:700;font-size:14px}
ul.rules{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
/* quiz */
.qbar{position:sticky;top:0;z-index:12;background:var(--bg2);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.qbar .in{max-width:720px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;justify-content:space-between}
.timer{font-family:var(--display);font-size:28px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;background:var(--card);padding:4px 12px 0;border-radius:10px;border:1px solid var(--line)}
.timer.low{color:#fff;background:var(--bad);border-color:var(--bad)}
.prog{height:4px;background:var(--line)}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold))}
.qtext{font-size:18px;font-weight:700;line-height:1.45;margin:6px 0 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);border-radius:12px;padding:12px;cursor:pointer}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:14px}
.opt.sel{border-color:var(--green);background:rgba(63,207,94,.12)}
.opt.sel b{background:var(--green);color:#06210e}
.qnav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:9px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);font-weight:800;cursor:pointer}
.pal button.ans{background:var(--green-d);border-color:var(--green-d)}
.pal button.mark{background:var(--gold);border-color:var(--gold);color:#241a00}
.pal button.cur{outline:3px solid var(--gold);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
/* result */
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ring{--p:0;width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring div{width:88px;height:88px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-family:var(--display);font-size:38px;color:var(--gold)}
.ring small{display:block;color:var(--muted);font-size:12px}
.rv{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:0 12px 12px 0;padding:10px 12px;background:var(--card)}
.rv.ok{border-left-color:var(--ok)}.rv.bad{border-left-color:var(--bad)}.rv.skip{border-left-color:var(--warn)}
.rv p{margin:4px 0}
.rv .exp{background:var(--card2);border-radius:10px;padding:8px 10px;font-size:15px}
.tag{font-weight:800;font-size:13px}.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}.tag.skip{color:var(--warn)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--card2);color:var(--gold)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:rgba(63,207,94,.12);font-weight:800}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.overlay .card{max-width:420px;width:100%}
.ebook{display:flex;gap:14px;align-items:flex-start}
.cover{flex:none;width:76px;height:104px;border-radius:8px;background:linear-gradient(160deg,#1f5f3a,#0e1410);border:1px solid var(--gold-d);display:flex;flex-direction:column;justify-content:space-between;padding:7px;font-family:var(--display);color:var(--gold);line-height:1}
.cover span{font-size:15px;word-break:break-word}.cover small{font-family:var(--body);font-size:9px;color:var(--muted)}
.empty{text-align:center;padding:24px 12px;color:var(--muted)}
sup{font-size:.7em}
@media (max-width:420px){.stats4{grid-template-columns:repeat(2,1fr)}.qtext{font-size:17px}.hero h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;background:linear-gradient(135deg,var(--gold),#ffd54a);color:#111;border:0;border-radius:999px;padding:11px 16px;font:inherit;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.45);display:flex;align-items:center;gap:6px;cursor:pointer}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 13px;border-radius:14px;white-space:normal;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--green-d);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai b{color:var(--gold)}
.msg ul{margin:4px 0;padding-left:18px}
.fact{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px;font-size:14px}
.fact .ans{color:var(--green);font-weight:700}
.askbar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding:8px 0}
.askbar textarea{flex:1;min-height:46px;max-height:120px;resize:none;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px;font:inherit}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<button class="fab" id="fab" onclick="go('ask')" aria-label="Ask AI">✨ Ask AI</button>
<nav class="nav" id="nav"><div class="in">
  <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-go="tests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5h10M9 12h10M9 19h10"/><path d="M4 5l1 1 2-2M4 12l1 1 2-2M4 19l1 1 2-2"/></svg>Tests</button>
  <button data-go="ebooks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>eBooks</button>
  <button data-go="semester"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>Semester</button>
  <button data-go="results"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Results</button>
  <button data-go="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</button>
</div></nav>

<script src="tests.js"></script>
<script>
/* ================= SETTINGS (yahin badlein) ================= */
var CONFIG = {
  appName: 'Agrikranti',
  tagline: 'Agriculture exam ki taiyari - Test Series, eBooks aur Notes',
  marksPerQ: 2,
  negative: 0,              // galat jawab par minus (jaise 0.5)
  durationMin: 60,
  youtube: 'https://youtube.com/@agrikranti1928?si=Qw-0KZ0QuNSLlvgG',
  instagram: 'https://www.instagram.com/agrikranti1928',
  whatsapp: 'https://chat.whatsapp.com/FP6cEJLOWLyK5Rt31PJGMA?s=cl&p=a&iam=2',
  telegram: 'https://t.me/Agrikranti_Aditya_Kumar',
  telegramName: '@Agrikranti_Aditya_Kumar',
  upiId: 'kumarvsaditya1@ibl',       // PhonePe scanner ka UPI ID
  payeeName: 'ADITYA KUMAR',
  // Leaderboard + admin data ke liye Google Apps Script ka URL (BACKEND_SETUP.txt dekhein). Khali = offline mode.
  backendUrl: '',
  // Ask AI: Google Apps Script (Gemini) ka URL - admin panel ke Settings mein daalein. Khali = sirf app ke notes/prashnon se jawab.
  aiUrl: ''
};
/* eBooks: free = seedha khulegi; paid = payment ke baad unlock code se khulegi */
var EBOOKS = [
  { id: 'notes1', title: 'Agriculture Complete Notes (Full)', sub: 'Lecture 1 - 36 + extra notes · Agronomy, Soil Science, Horticulture, Breeding, Plant Protection, Extension, Animal Science', pages: 60,
    price: 99, cover: 'FULL<br>NOTES' },
  { id: 'sample1', title: 'Free Sample - Agriculture Notes', sub: 'Full notes ke pehle 10 pages, pehle padhkar dekhein', pages: 10,
    price: 0, file: 'ebooks/Agrikranti_Notes_Free_Sample.pdf', cover: 'FREE<br>SAMPLE' }
];

/* B.Sc. Agriculture semester papers: har subject ka question paper + solution (free) */
var SEMESTER = [
  { sem: 1, title: 'B.Sc. Agriculture - 1st Semester', papers: [
    { code: 'SSC-101', subject: 'Fundamentals of Soil Science', info: 'Model Paper (Previous Year Pattern) · 50 अंक · Q.1 अनिवार्य + Section A (4×5) + Section B (2×10)',
      paper: 'papers/BSc_Sem1_SSC101_Question_Paper.pdf', solution: 'papers/BSc_Sem1_SSC101_Solved_Paper.pdf', pages: 14 }
  ]}
];

/* ===== Live content: admin panel se badla gaya content.json yahan load hota hai ===== */
var NOTICE=null;
function applyContent(c){
  if(!c) return;
  if(c.config) Object.keys(c.config).forEach(function(k){ if(c.config[k]!==''&&c.config[k]!=null) CONFIG[k]=c.config[k]; });
  if(c.ebooks) EBOOKS=c.ebooks;
  if(c.semester) SEMESTER=c.semester;
  NOTICE=(c.notice&&c.notice.text)?c.notice:null;
}
function loadContent(){
  var done=false;
  return new Promise(function(res){
    var t=setTimeout(function(){ if(!done){ done=true; res(); } },3500);
    fetch('content.json?v='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.json():null; })
      .then(function(c){ applyContent(c); }).catch(function(){})
      .then(function(){ if(!done){ done=true; clearTimeout(t); res(); } });
  });
}
/* ===== Ginti (stats): kitne log app khol rahe / install kar rahe - admin panel mein dikhta hai ===== */
var STATS_NS='agrikranti1928-app';
function hit(key){ try{ fetch('https://abacus.jasoncameron.dev/hit/'+STATS_NS+'/'+key,{mode:'cors'}).catch(function(){}); }catch(e){} }
function trackOpen(){
  hit('opens');
  if(!get('counted',0)){ set('counted',1); hit('users'); }
  var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  if(standalone && !get('inst',0)){ set('inst',1); hit('installs'); }
  var d=new Date().toISOString().slice(0,10); if(get('day','')!==d){ set('day',d); hit('day-'+d); }
}
window.addEventListener('appinstalled',function(){ if(!get('inst',0)){ set('inst',1); hit('installs'); } });
document.addEventListener('click',function(e){ var a=e.target.closest&&e.target.closest('a[href$=".pdf"]'); if(a) hit('pdf-opens'); });

/* ================= helpers ================= */
var app = document.getElementById('app');
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmt(s){ return esc(s).replace(/(\d+)\^(\d+)/g,'$1<sup>$2</sup>'); }
function get(k,d){ try{ var v=JSON.parse(localStorage.getItem('ak_'+k)); return v==null?d:v; }catch(e){ return d; } }
function set(k,v){ try{ localStorage.setItem('ak_'+k,JSON.stringify(v)); }catch(e){} }
function del(k){ try{ localStorage.removeItem('ak_'+k); }catch(e){} }
function mmss(t){ t=Math.max(0,Math.round(t)); return Math.floor(t/60)+':'+('0'+(t%60)).slice(-2); }
function hash(str){ var h=7; for(var i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))%2147483647; return h; }
function shuffle(arr,seed){ var a=arr.slice(),s=seed||1; for(var i=a.length-1;i>0;i--){ s=(s*9301+49297)%233280; var j=Math.floor(s/233280*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function now(){ var d=new Date(); return ('0'+d.getDate()).slice(-2)+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+d.getFullYear()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function testById(id){ return TESTS.filter(function(t){return t.id===id;})[0]; }
function maxMarks(t){ return t.questions.length*CONFIG.marksPerQ; }
function shortTitle(t){ return t.title.split(' - ')[0]; }
function topicOf(t){ return t.title.split(' - ').slice(1).join(' - '); }
function profile(){ return get('profile',null); }
function attempts(){ return get('attempts',[]); }
function bestFor(id){ var b=null; attempts().forEach(function(a){ if(a.testId===id && (!b||a.score>b.score)) b=a; }); return b; }
function lastFor(id){ var l=null; attempts().forEach(function(a){ if(a.testId===id) l=a; }); return l; }
function api(params, body){
  var url=CONFIG.backendUrl+'?'+Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k]);}).join('&');
  var opt=body?{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain;charset=utf-8'}}:{};
  return fetch(url,opt).then(function(r){return r.json();}).then(function(j){ if(j.error) throw new Error(j.error); return j; });
}
function topbar(extra){ return '<header class="topbar"><div class="in"><img src="icons/logo.png" alt=""><div class="brand">'+esc(CONFIG.appName)+'<small>1928 · Agri Exam Prep</small></div><div class="sp"></div>'+(extra||'')+'<button class="iconbtn" data-share="1" aria-label="ऐप शेयर करें"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="vertical-align:-3px"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg> Share</button></div></header>'; }
document.addEventListener('click',function(e){ var t=e.target.closest && e.target.closest('[data-share]'); if(t){ e.preventDefault(); shareApp(); } });
function setNav(on){ document.getElementById('nav').hidden=!on; }

/* ================= Quiz ================= */
function startQuiz(o){
  setNav(false);
  var t=testById(o.testId), p=profile(), seed=hash((p?p.mobile:'x')+t.id+(o.resume?o.resume.seed:Date.now()));
  if(o.resume) seed=o.resume.seed;
  S.test=t; S.seed=seed;
  S.order=shuffle(t.questions.map(function(q,i){return i;}),seed);
  S.optOrder={}; t.questions.forEach(function(q,i){ S.optOrder[i]=shuffle([0,1,2,3],seed+i*13+1); });
  S.answers=o.resume?o.resume.answers:{}; S.marks=o.resume?o.resume.marks:{};
  S.cur=o.resume?o.resume.cur:0; S.start=o.resume?o.resume.start:Date.now();
  save(); renderQ(); clearInterval(S.timer); S.timer=setInterval(tick,1000);
}
function save(){ set('progress',{testId:S.test.id,answers:S.answers,marks:S.marks,cur:S.cur,start:S.start,seed:S.seed}); }
function remaining(){ return CONFIG.durationMin*60-(Date.now()-S.start)/1000; }
function tick(){ var r=remaining(), el=document.getElementById('tm'); if(el){ el.textContent=mmss(r); el.classList.toggle('low',r<300);} if(r<=0){ clearInterval(S.timer); submit(true);} }
function renderQ(){
  var n=S.order.length, qi=S.order[S.cur], q=S.test.questions[qi], done=Object.keys(S.answers).length;
  var h='<div class="qbar"><div class="in"><b>'+esc(shortTitle(S.test))+'</b><span class="timer" id="tm">'+mmss(remaining())+'</span><button class="btn gold" id="sub" style="min-height:38px;padding:6px 14px">Submit</button></div><div class="prog"><i style="width:'+(done/n*100)+'%"></i></div></div>';
  h+='<main class="page"><div class="card"><div class="muted small" style="font-weight:700">प्रश्न '+(S.cur+1)+' / '+n+' · '+done+' हल किए</div><div class="qtext">'+fmt(q.q)+'</div><div class="opts">';
  S.optOrder[qi].forEach(function(oi,k){ h+='<button class="opt'+(S.answers[qi]===oi?' sel':'')+'" data-o="'+oi+'"><b>'+'ABCD'[k]+'</b><span>'+fmt(q.o[oi])+'</span></button>'; });
  h+='</div><div class="qnav"><button class="btn ghost" id="pv"'+(S.cur===0?' disabled':'')+'>पिछला</button><button class="btn ghost" id="mk">'+(S.marks[qi]?'Unmark':'Review')+'</button><button class="btn" id="nx">'+(S.cur===n-1?'अंतिम':'अगला')+'</button></div>'
    +'<div class="row" style="margin-top:8px"><button class="btn ghost" id="cl" style="min-height:38px;padding:6px 12px">उत्तर हटाएं</button></div></div>';
  h+='<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="legend"><span style="--c:var(--green-d)">हल किया</span><span style="--c:var(--gold)">Review</span><span style="--c:var(--line)">बाकी</span></div><div class="pal">';
  S.order.forEach(function(qq,k){ h+='<button data-g="'+k+'" class="'+(S.answers[qq]!==undefined?'ans ':'')+(S.marks[qq]?'mark ':'')+(k===S.cur?'cur':'')+'">'+(k+1)+'</button>'; });
  h+='</div></div></main>';
  app.innerHTML=h;
  app.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){ S.answers[qi]=Number(b.getAttribute('data-o')); save(); renderQ(); }; });
  app.querySelectorAll('[data-g]').forEach(function(b){ b.onclick=function(){ S.cur=Number(b.getAttribute('data-g')); save(); renderQ(); window.scrollTo(0,0); }; });
  document.getElementById('pv').onclick=function(){ if(S.cur>0){S.cur--; save(); renderQ(); window.scrollTo(0,0);} };
  document.getElementById('nx').onclick=function(){ if(S.cur<n-1){S.cur++; save(); renderQ(); window.scrollTo(0,0);} else confirmSubmit(); };
  document.getElementById('mk').onclick=function(){ S.marks[qi]=!S.marks[qi]; save(); renderQ(); };
  document.getElementById('cl').onclick=function(){ delete S.answers[qi]; save(); renderQ(); };
  document.getElementById('sub').onclick=confirmSubmit;
}
function confirmSubmit(){
  var n=S.order.length, done=Object.keys(S.answers).length, o=document.createElement('div'); o.className='overlay';
  o.innerHTML='<div class="card" style="display:flex;flex-direction:column;gap:12px"><b>टेस्ट submit करें?</b><p style="margin:0" class="muted">आपने '+done+' / '+n+' प्रश्न हल किए हैं। '+(n-done)+' बाकी हैं।</p><div class="row"><button class="btn gold" id="cY">हाँ, submit करें</button><button class="btn ghost" id="cN">वापस</button></div></div>';
  document.body.appendChild(o);
  o.querySelector('#cN').onclick=function(){ o.remove(); };
  o.querySelector('#cY').onclick=function(){ o.remove(); submit(false); };
}
function submit(auto){
  clearInterval(S.timer);
  var t=S.test, c=0,w=0,s=0;
  t.questions.forEach(function(q,i){ var a=S.answers[i]; if(a===undefined||a===null) s++; else if(Number(a)===q.a) c++; else w++; });
  var p=profile();
  var res={id:Date.now(),testId:t.id,title:t.title,name:p.name,mobile:p.mobile,score:Math.round((c*CONFIG.marksPerQ-w*CONFIG.negative)*100)/100,max:maxMarks(t),correct:c,wrong:w,skipped:s,
    timeTaken:Math.round((Date.now()-S.start)/1000),when:now(),answers:S.answers,auto:!!auto};
  var at=attempts(); at.push(res); if(at.length>200) at=at.slice(-200); set('attempts',at); del('progress'); hit('tests-submitted');
  setNav(true); review(res, true);
  if(CONFIG.backendUrl){
    api({action:'submit'},{testId:t.id,title:t.title,name:p.name,mobile:p.mobile,score:res.score,max:res.max,correct:c,wrong:w,skipped:s,timeTaken:res.timeTaken,answers:S.answers})
      .then(function(r){ var el=document.getElementById('rank'); if(el && r.rank) el.innerHTML='<b style="color:var(--gold)">Rank '+r.rank+' / '+r.total+'</b>'+(r.attemptNo>1?' <span class="muted small">(leaderboard में पहला attempt गिना जाता है)</span>':''); })
      .catch(function(){ var el=document.getElementById('rank'); if(el) el.innerHTML='<span class="muted small">Leaderboard अभी अपडेट नहीं हो पाया, बाद में देखें।</span>'; });
  }
}

/* ================= Result + Review ================= */
function review(res, fresh){
  activeTab('tests');
  if(!res){ return tests(); }

var KB=null;
function normTxt(t){ return String(t||'').toLowerCase().replace(/\bc\s*:\s*n\b/g,' cnratio ').replace(/[^ऀ-ॿa-z0-9 ]+/g,' '); }
var STOP={'क्या':1,'है':1,'हैं':1,'की':1,'का':1,'के':1,'में':1,'से':1,'को':1,'और':1,'कौन':1,'सा':1,'सी':1,'किस':1,'किसे':1,'कब':1,'कहाँ':1,'होता':1,'होती':1,'होते':1,'लिए':1,'पर':1,'एक':1,'यह':1,'वह':1,'भी':1,'तो':1,'कितना':1,'कितने':1,'कितनी':1,'जाता':1,'जाती':1,'कहते':1,'the':1,'is':1,'of':1,'in':1,'a':1,'an':1,'what':1,'which':1,'and':1,'to':1,'for':1,'who':1,'how':1,'kya':1,'hai':1,'ka':1,'ki':1,'ke':1,'me':1,'se':1,'बताओ':1,'बताइए':1,'बताएं':1,'बताये':1,'समझाओ':1,'समझाइए':1,'लिखो':1,'लिखिए':1,'विशेषता':1,'विशेषताएँ':1,'विशेषताएं':1,'गुण':1,'मुख्य':1,'प्रमुख':1,'कार्य':1,'महत्व':1,'उपयोग':1,'explain':1,'define':1,'meaning':1,'mean':1,'about':1,'tell':1,'me':1,'कैसे':1,'क्यों':1,'हुआ':1,'हुई':1,'था':1,'थी':1,'बारे':1,'मतलब':1};
function toks(t){ return normTxt(t).split(/\s+/).filter(function(w){ return w.length>1 && !STOP[w]; }); }
function buildKB(){
  KB=[]; var df={};
  TESTS.forEach(function(t){ t.questions.forEach(function(q){ var tk=toks(q.q+' '+q.o[q.a]+' '+q.e), u={}; tk.forEach(function(w){ u[w]=1; }); Object.keys(u).forEach(function(w){ df[w]=(df[w]||0)+1; }); KB.push({q:q.q,a:q.o[q.a],e:q.e,set:u,t:shortTitle(t)}); }); });
  KB.df=df;
}
function searchKB(query,n){
  if(!KB) buildKB(); var qt=toks(query), N=KB.length; if(!qt.length) return [];
  return KB.map(function(k){ var sc=0, hitN=0; qt.forEach(function(w){ if(k.set[w]){ sc+=Math.log(1+N/(KB.df[w]||1)); hitN++; } else if(w.length>4){ for(var x in k.set){ if(x.length>4 && (x.indexOf(w)===0||w.indexOf(x)===0)){ sc+=0.5*Math.log(1+N/(KB.df[x]||1)); hitN+=0.5; break; } } } }); var cov=hitN/qt.length; return {k:k,s:sc*cov,c:cov}; })
    .filter(function(r){ return r.s>1.5 && r.c>=(qt.length>1?0.6:1); }).sort(function(a,b){ return b.s-a.s; }).filter(function(r,i,arr){ return r.s>=arr[0].s*0.6; }).slice(0,n||4).map(function(r){ return r.k; });
}
function mdLite(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#+\s*(.+)$/gm,'<b>$1</b>').replace(/^\s*[-*•]\s+(.+)$/gm,'• $1').replace(/(\d+)\^(\d+)/g,'$1<sup>$2</sup>').replace(/\n/g,'<br>'); }
function factsHtml(fs){ return fs.map(function(f){ return '<div class="fact">'+fmt(f.q)+'<br><span class="ans">✔ '+fmt(f.a)+'</span><div class="muted small">'+fmt(f.e)+'</div></div>'; }).join(''); }
function askAI(){

  if(!at.length){ h+='<div class="card empty">अभी तक कोई टेस्ट नहीं दिया है।<br><br><button class="btn" data-go2="tests">पहला टेस्ट दें</button></div>'; }
  else{
    var best={}; at.forEach(function(a){ if(!best[a.testId]||a.score>best[a.testId].score) best[a.testId]=a; });
    h+='<div class="card"><b>Test-wise सर्वश्रेष्ठ अंक</b><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">';
    TESTS.forEach(function(t){ var b=best[t.id], p=b?Math.round(b.score/b.max*100):0;
      h+='<div><div class="row" style="justify-content:space-between"><span class="small">'+esc(shortTitle(t))+'</span><span class="small" style="font-variant-numeric:tabular-nums">'+(b?b.score+'/'+b.max:'-')+'</span></div><div style="height:8px;background:var(--line);border-radius:9px;overflow:hidden"><i style="display:block;height:100%;width:'+p+'%;background:linear-gradient(90deg,var(--green),var(--gold))"></i></div></div>'; });
    h+='</div></div><div class="tbl"><table><thead><tr><th>Test</th><th>अंक</th><th>सही</th><th>गलत</th><th>समय</th><th>तारीख</th></tr></thead><tbody>';
    at.forEach(function(a,i){ h+='<tr data-rv="'+a.id+'" style="cursor:pointer"><td>'+esc(a.testId)+'</td><td class="num">'+a.score+'/'+a.max+'</td><td class="num">'+a.correct+'</td><td class="num">'+a.wrong+'</td><td class="num">'+mmss(a.timeTaken)+'</td><td>'+esc(a.when)+'</td></tr>'; });
    h+='</tbody></table></div><p class="muted small" style="margin:0">किसी पंक्ति पर टैप करके उस टेस्ट के उत्तर देखें।</p>';
  }
  h+='</main>'; app.innerHTML=h; bindCommon();
  app.querySelectorAll('[data-rv]').forEach(function(r){ r.onclick=function(){ var id=Number(r.getAttribute('data-rv')); go('review',attempts().filter(function(a){return a.id===id;})[0]); }; });
}

/* ================= Leaderboard (backend) ================= */
function leaderboard(testId){
  activeTab('tests');
  var t=testById(testId);
  app.innerHTML=topbar()+'<main class="page"><h2 class="sec">Leader<span>board</span></h2><p class="muted" style="margin:0">'+esc(shortTitle(t))+'</p><div class="card empty">लोड हो रहा है...</div></main>';
  api({action:'leaderboard',test:testId}).then(function(lb){
    var p=profile()||{}, mm=p.mobile?p.mobile.slice(0,2)+'******'+p.mobile.slice(8):'';
    var h=topbar()+'<main class="page"><h2 class="sec">Leader<span>board</span></h2><div class="row"><span class="chip">'+esc(shortTitle(t))+'</span><span class="chip">'+lb.total+' छात्र</span></div>';
    if(!lb.rows.length) h+='<div class="card empty">अभी तक किसी ने यह टेस्ट नहीं दिया। पहले बनकर टॉप पर आएँ!</div>';
    else{ h+='<div class="tbl"><table><thead><tr><th>#</th><th>नाम</th><th>मोबाइल</th><th>अंक</th><th>समय</th></tr></thead><tbody>';
      lb.rows.forEach(function(x){ var me=x.mobile===mm && x.name===p.name; h+='<tr'+(me?' class="me"':'')+'><td>'+(x.rank<=3?['🥇','🥈','🥉'][x.rank-1]:x.rank)+'</td><td>'+esc(x.name)+(me?' (आप)':'')+'</td><td>'+esc(x.mobile)+'</td><td class="num">'+x.score+'</td><td class="num">'+mmss(x.time)+'</td></tr>'; });
      h+='</tbody></table></div><p class="muted small" style="margin:0">हर मोबाइल नंबर का केवल पहला attempt गिना जाता है।</p>'; }
    h+='<div class="row"><button class="btn" id="rf">Refresh</button><button class="btn ghost" data-go2="tests">सभी टेस्ट</button></div></main>';
    app.innerHTML=h; bindCommon(); document.getElementById('rf').onclick=function(){ leaderboard(testId); };
  }).catch(function(e){ app.innerHTML=topbar()+'<main class="page"><div class="card"><b>Leaderboard लोड नहीं हुआ</b><p class="muted">इंटरनेट जाँचें और दोबारा कोशिश करें।</p><button class="btn" data-go2="tests">वापस</button></div></main>'; bindCommon(); });
}

/* ================= Profile ================= */
function profilePage(){
  activeTab('profile');
  var p=profile()||{name:'',mobile:''};
  var h=topbar()+'<main class="page"><h2 class="sec">मेरी <span>Profile</span></h2><form class="card" id="pf" novalidate style="display:flex;flex-direction:column;gap:12px"><div><label for="pn">नाम</label><input id="pn" maxlength="40" value="'+esc(p.name)+'"></div><div><label for="pm">मोबाइल नंबर</label><input id="pm" inputmode="numeric" maxlength="10" value="'+esc(p.mobile)+'"></div><div class="err" id="pe"></div><button class="btn" type="submit">सेव करें</button></form>';
  h+='<div class="card"><b>Agrikranti ऐप फोन में इंस्टॉल करें</b><ul class="rules" style="margin-top:6px"><li>Chrome में यह पेज खोलें।</li><li>ऊपर दाईं ओर ⋮ मेनू → <b>"Add to Home screen" / "Install app"</b> दबाएँ।</li><li>होम स्क्रीन पर Agrikranti का आइकन आ जाएगा, ऐप की तरह खुलेगा।</li></ul>'+(window.__deferredPrompt?'<button class="btn gold block" id="installBtn2" style="margin-top:10px">अभी इंस्टॉल करें</button>':'')+'</div>';
  h+=shareCard();
  h+='<h2 class="sec">हमसे <span>जुड़ें</span></h2>'+socialCards();
  h+='<div class="card small muted">Agrikranti 1928 · Agriculture competitive exams (ICAR, UPCATET, AGTA, Sugarcane Supervisor, JRF आदि) की तैयारी।<br>आपका डेटा (नाम, नंबर, results) आपके फोन में सुरक्षित रहता है।</div>';
  if(CONFIG.backendUrl) h+='<button class="btn ghost block" id="adm">Admin</button>';
  h+='</main>'; app.innerHTML=h;
  document.getElementById('pf').onsubmit=function(e){ e.preventDefault(); var n=document.getElementById('pn').value.replace(/\s+/g,' ').trim(), m=document.getElementById('pm').value.replace(/\D/g,''), er=document.getElementById('pe');
    if(n.length<2){ er.className='err'; er.textContent='कृपया नाम लिखें।'; return; } if(!/^[6-9]\d{9}$/.test(m)){ er.className='err'; er.textContent='सही 10 अंकों का नंबर लिखें।'; return; }
    set('profile',{name:n,mobile:m}); er.className='okmsg'; er.textContent='Profile सेव हो गई।'; };
  var i2=document.getElementById('installBtn2'); if(i2) i2.onclick=doInstall;
  var a=document.getElementById('adm'); if(a) a.onclick=function(){ go('admin'); };
}

/* ================= Admin (backend) ================= */
function adminLogin(){
  setNav(true);
  app.innerHTML=topbar()+'<main class="page"><form class="card" id="af" style="display:flex;flex-direction:column;gap:12px"><h2 class="sec" style="margin:0">Admin <span>Panel</span></h2><div><label for="ak">Admin password</label><input id="ak" type="password"></div><div class="err" id="ae"></div><button class="btn" type="submit">Login</button></form></main>';
  document.getElementById('af').onsubmit=function(e){ e.preventDefault(); var k=document.getElementById('ak').value;
    api({action:'admin',key:k}).then(function(d){ adminView(d,k); }).catch(function(m){ document.getElementById('ae').textContent=m.message||'Login नहीं हुआ'; }); };
}
function adminView(d,key){
  var filt='',q='';
  function draw(){
    var rows=d.rows.filter(function(r){ return (!filt||r.testId===filt)&&(!q||(r.name+' '+r.mobile).toLowerCase().indexOf(q)>=0); });
    var st={}; rows.forEach(function(r){ st[r.mobile]=1; });
    var avg=rows.length?(rows.reduce(function(s,r){return s+Number(r.score);},0)/rows.length).toFixed(1):0;
    var h='<div class="stats4"><div class="stat"><b>'+rows.length+'</b><span>Attempts</span></div><div class="stat"><b>'+Object.keys(st).length+'</b><span>छात्र</span></div><div class="stat"><b>'+avg+'</b><span>औसत</span></div><div class="stat"><b>'+(rows.length?Math.max.apply(null,rows.map(function(r){return Number(r.score);})):0)+'</b><span>Top</span></div></div><div class="tbl"><table><thead><tr><th>समय</th><th>Test</th><th>नाम</th><th>मोबाइल</th><th>अंक</th><th>सही</th><th>गलत</th><th>समय</th><th>#</th></tr></thead><tbody>';
    rows.forEach(function(r){ h+='<tr><td>'+esc(r.ts)+'</td><td>'+esc(r.testId)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.mobile)+'</td><td class="num">'+r.score+'/'+r.max+'</td><td class="num">'+r.correct+'</td><td class="num">'+r.wrong+'</td><td class="num">'+mmss(r.time)+'</td><td class="num">'+r.attempt+'</td></tr>'; });
    document.getElementById('out').innerHTML=h+'</tbody></table></div>';
  }
  var opts='<option value="">सभी टेस्ट</option>'+TESTS.map(function(t){return '<option value="'+t.id+'">'+esc(shortTitle(t))+'</option>';}).join('');
  app.innerHTML=topbar()+'<main class="page"><h2 class="sec">Admin <span>Panel</span></h2><div class="grid2"><select id="ft" style="padding:12px;border-radius:12px;background:var(--bg2);color:var(--ink);border:1.5px solid var(--line);font:inherit">'+opts+'</select><input id="sq" placeholder="नाम / मोबाइल खोजें"></div><div id="out" style="display:flex;flex-direction:column;gap:12px"></div><button class="btn ghost" id="rl">Refresh</button><p class="muted small">पूरा डेटा Google Sheet "Results" में भी है।</p></main>';
  document.getElementById('ft').onchange=function(e){ filt=e.target.value; draw(); };
  document.getElementById('sq').oninput=function(e){ q=e.target.value.toLowerCase(); draw(); };
  document.getElementById('rl').onclick=function(){ api({action:'admin',key:key}).then(function(nd){ d=nd; draw(); }); };
  draw();
}

/* ================= PWA install ================= */
window.__deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); window.__deferredPrompt=e; var b=document.getElementById('installBtn'); if(!b && document.querySelector('.topbar .in')) home(); });
function installBtnHtml(){ return window.__deferredPrompt?'<button class="iconbtn" id="installBtn">⬇ Install</button>':''; }
function doInstall(){ var p=window.__deferredPrompt; if(!p) return; p.prompt(); p.userChoice.then(function(){ window.__deferredPrompt=null; }); }
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){ navigator.serviceWorker.register('sw.js').catch(function(){}); }

/* start */
loadContent().then(function(){ if(location.hash==='#admin' && CONFIG.backendUrl) go('admin'); else go('home'); trackOpen(); });
</script>
