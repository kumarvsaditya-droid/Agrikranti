<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1410">
<meta name="description" content="Agrikranti 1928 - Agriculture competitive exam test series, eBooks aur notes">
<title>Agrikranti</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Mukta:wght@400;500;700;800&display=swap">
<style>
/* Agrikranti brand: field-night black, crop green, harvest gold (taken from the channel logo) */
:root{
  --bg:#0e1410; --bg2:#141d17; --card:#18231c; --card2:#1f2c23; --line:#2b3b30;
  --ink:#eef4ee; --muted:#9fb3a5; --green:#3fcf5e; --green-d:#1f8f3a; --gold:#f2b705; --gold-d:#c48f00;
  --ok:#4fd36a; --bad:#ff6b6b; --warn:#f2b705;
  --display:'Teko','Mukta',system-ui,sans-serif; --body:'Mukta','Noto Sans Devanagari',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
a{color:var(--gold)}
button{font:inherit}
.app{min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.page{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
/* top bar */
.topbar{position:sticky;top:0;z-index:10;background:rgba(14,20,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar .in{max-width:720px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.topbar img{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold)}
.brand{font-family:var(--display);font-size:28px;line-height:1;letter-spacing:.5px;color:var(--gold)}
.brand small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.topbar .sp{flex:1}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:700;font-size:14px}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;color:var(--muted);padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;cursor:pointer}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--gold)}
/* blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.hero{background:radial-gradient(120% 140% at 0% 0%,#1d3a22 0%,var(--card) 55%);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center}
.hero img{width:86px;height:86px;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--gold),0 0 22px rgba(63,207,94,.35)}
.hero h1{font-family:var(--display);font-size:34px;line-height:.95;margin:0;color:var(--gold);letter-spacing:.5px}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
h2.sec{font-family:var(--display);font-size:26px;line-height:1;margin:6px 0 0;letter-spacing:.4px}
h2.sec span{color:var(--green)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{appearance:none;border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;min-height:46px;background:var(--green);color:#06210e}
.btn.gold{background:var(--gold);color:#241a00}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav button:focus-visible,.opt:focus-visible,.pal button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stat{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tcard{display:flex;gap:12px;align-items:flex-start}
.tnum{flex:none;width:52px;height:52px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:30px;color:var(--gold);line-height:1}
.tcard h3{margin:0;font-size:16px;line-height:1.35}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{background:var(--card2);color:var(--muted);border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700}
.chip.done{background:rgba(63,207,94,.15);color:var(--green)}
.link{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.link .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.link b{display:block}
.yt{background:#ff0033}.tg{background:#2aa1da}.wa{background:#1fae54}.ig{background:linear-gradient(45deg,#f9a825,#e91e63,#7b1fa2)}
label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
input{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);color:var(--ink);font:inherit}
.err{color:var(--bad);font-weight:700;font-size:14px;min-height:1.2em}
.okmsg{color:var(--ok);font-weight:700;font-size:14px}
ul.rules{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
/* quiz */
.qbar{position:sticky;top:0;z-index:12;background:var(--bg2);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.qbar .in{max-width:720px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;justify-content:space-between}
.timer{font-family:var(--display);font-size:28px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;background:var(--card);padding:4px 12px 0;border-radius:10px;border:1px solid var(--line)}
.timer.low{color:#fff;background:var(--bad);border-color:var(--bad)}
.prog{height:4px;background:var(--line)}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold))}
.qtext{font-size:18px;font-weight:700;line-height:1.45;margin:6px 0 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);border-radius:12px;padding:12px;cursor:pointer}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:14px}
.opt.sel{border-color:var(--green);background:rgba(63,207,94,.12)}
.opt.sel b{background:var(--green);color:#06210e}
.qnav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:9px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);font-weight:800;cursor:pointer}
.pal button.ans{background:var(--green-d);border-color:var(--green-d)}
.pal button.mark{background:var(--gold);border-color:var(--gold);color:#241a00}
.pal button.cur{outline:3px solid var(--gold);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
/* result */
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ring{--p:0;width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring div{width:88px;height:88px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-family:var(--display);font-size:38px;color:var(--gold)}
.ring small{display:block;color:var(--muted);font-size:12px}
.rv{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:0 12px 12px 0;padding:10px 12px;background:var(--card)}
.rv.ok{border-left-color:var(--ok)}.rv.bad{border-left-color:var(--bad)}.rv.skip{border-left-color:var(--warn)}
.rv p{margin:4px 0}
.rv .exp{background:var(--card2);border-radius:10px;padding:8px 10px;font-size:15px}
.tag{font-weight:800;font-size:13px}.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}.tag.skip{color:var(--warn)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--card2);color:var(--gold)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:rgba(63,207,94,.12);font-weight:800}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.overlay .card{max-width:420px;width:100%}
.ebook{display:flex;gap:14px;align-items:flex-start}
.cover{flex:none;width:76px;height:104px;border-radius:8px;background:linear-gradient(160deg,#1f5f3a,#0e1410);border:1px solid var(--gold-d);display:flex;flex-direction:column;justify-content:space-between;padding:7px;font-family:var(--display);color:var(--gold);line-height:1}
.cover span{font-size:15px;word-break:break-word}.cover small{font-family:var(--body);font-size:9px;color:var(--muted)}
.empty{text-align:center;padding:24px 12px;color:var(--muted)}
sup{font-size:.7em}
@media (max-width:420px){.stats4{grid-template-columns:repeat(2,1fr)}.qtext{font-size:17px}.hero h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;background:linear-gradient(135deg,var(--gold),#ffd54a);color:#111;border:0;border-radius:999px;padding:11px 16px;font:inherit;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.45);display:flex;align-items:center;gap:6px;cursor:pointer}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 13px;border-radius:14px;white-space:normal;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--green-d);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai b{color:var(--gold)}
.msg ul{margin:4px 0;padding-left:18px}
.fact{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px;font-size:14px}
.fact .ans{color:var(--green);font-weight:700}
.askbar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding:8px 0}
.askbar textarea{flex:1;min-height:46px;max-height:120px;resize:none;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px;font:inherit}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}
/* ===== Gurukul-style layout ===== */
.tb2 .in{gap:8px;padding-top:8px;padding-bottom:8px}
.hb{background:none;border:0;color:var(--ink);padding:6px;cursor:pointer;display:grid;place-items:center}
.catbtn{background:none;border:0;color:var(--ink);font:inherit;font-weight:800;font-size:18px;display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 2px;min-width:0}
.catbtn img{width:30px;height:30px;border-radius:50%;border:2px solid var(--gold)}
.catbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bell{position:relative;background:none;border:0;color:var(--gold);padding:6px;cursor:pointer}
.bell i{position:absolute;top:0;right:0;background:#e53935;color:#fff;font-style:normal;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.hello{font-size:20px;font-weight:700;margin:2px 0 -4px}
.banner{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;min-height:168px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.slide img.lg{width:92px;height:92px;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--gold),0 0 22px rgba(63,207,94,.35)}
.slide h3{font-family:var(--display);font-size:32px;line-height:.95;margin:0;color:var(--gold);letter-spacing:.5px}
.slide p{margin:6px 0 0;font-size:13px;color:#dfe9e1}
.slide .tag{display:inline-block;margin-top:8px;background:var(--gold);color:#111;font-weight:800;font-size:12px;border-radius:99px;padding:2px 10px}
.slide.teach{padding:0;align-items:stretch;overflow:hidden;gap:0}.slide.teach .tpic{width:46%;max-width:220px;object-fit:cover;object-position:top;align-self:flex-end;height:100%;min-height:168px;-webkit-mask-image:linear-gradient(to left,#000 70%,transparent);mask-image:linear-gradient(to left,#000 70%,transparent)}
.slide.imgs{padding:0}.slide.imgs img{width:100%;display:block}
.dots2{position:absolute;bottom:7px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.dots2 b{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.35);transition:.2s}
.dots2 b.on{width:16px;background:var(--gold)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:12px;min-height:76px;padding:12px;display:flex;align-items:center;gap:12px;color:#fff;font:inherit;font-weight:800;font-size:15px;text-align:left;cursor:pointer;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.tile svg{width:34px;height:34px;flex:none;opacity:.95}
.t1{background:linear-gradient(120deg,#14532d,#1f8f3a)}.t2{background:linear-gradient(120deg,#7a5a00,#c48f00)}
.t3{background:linear-gradient(120deg,#0f4c45,#1f8a7a)}.t4{background:linear-gradient(120deg,#3d4a12,#6b8e23)}
.t5{background:linear-gradient(120deg,#5c3a00,#b8860b)}.t6{background:linear-gradient(120deg,#123524,#2e7d4f)}
.t7{background:linear-gradient(120deg,#2b3b30,#4a6b52)}.t8{background:linear-gradient(120deg,#6b4e00,#e0a800)}
.drawer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex}
.drawer .pn{width:min(82vw,320px);height:100%;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto;animation:sl .18s ease-out}
@keyframes sl{from{transform:translateX(-100%)}to{transform:none}}
.drawer .hd{padding:22px 18px 14px;border-bottom:1px solid var(--line)}
.drawer .hd img{width:64px;height:64px;border-radius:12px;border:2px solid var(--gold)}
.drawer .hd b{display:block;font-size:19px;margin-top:8px}
.drawer .it{display:flex;align-items:center;gap:16px;padding:13px 20px;background:none;border:0;color:var(--ink);font:inherit;font-size:16px;text-align:left;cursor:pointer;text-decoration:none;width:100%}
.drawer .it svg{width:22px;height:22px;color:var(--muted);flex:none}
.drawer .it:active{background:var(--card)}
.drawer .fol{border-top:1px solid var(--line);margin-top:6px;padding:14px 20px;text-align:center}
.drawer .fol .row{justify-content:center;margin-top:8px}
.drawer .fol a{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.catlist .c{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;margin-bottom:10px}
.catlist .c.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.catlist .c .ci{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card2);font-size:22px;flex:none}
.catlist .c b{display:block}
.fab{display:none!important}
.reader{position:fixed;inset:0;z-index:60;background:#2a2f2b;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.rbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line);padding-top:calc(8px + env(safe-area-inset-top,0px))}
.rbody{position:relative;flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 8px 40px}
.rpage{flex:none;background:#fff;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.4);overflow:hidden}
.rpage canvas{display:block;pointer-events:none}
@media print{body *{display:none!important}}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:8px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.pill.on{background:var(--ink);color:#0e1410;border-color:var(--ink)}
.pill i{font-style:normal;background:var(--gold);color:#111;border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
</style>
</head>

<script>
/* ================= SETTINGS (yahin badlein) ================= */
var CONFIG = {
  appName: 'Agrikranti',
  tagline: 'Agriculture exam ki taiyari - Test Series, eBooks aur Notes',
  marksPerQ: 2,

function startQuiz(o){
  setNav(false);
  var t=testById(o.testId), p=profile(), seed=hash((p?p.mobile:'x')+t.id+(o.resume?o.resume.seed:Date.now()));
  if(o.resume) seed=o.resume.seed;

  var idx=t.questions.map(function(q,i){return i;});
  S.order=t.fixed?idx:shuffle(idx,seed);
  S.optOrder={}; t.questions.forEach(function(q,i){ var oi=q.o.map(function(x,k){return k;}); S.optOrder[i]=t.fixed?oi:shuffle(oi,seed+i*13+1); });

function save(){ set('progress',{testId:S.test.id,answers:S.answers,marks:S.marks,cur:S.cur,start:S.start,seed:S.seed}); }
function remaining(){ return TD(S.test)*60-(Date.now()-S.start)/1000; }
function tick(){ var r=remaining(), el=document.getElementById('tm'); if(el){ el.textContent=mmss(r); el.classList.toggle('low',r<300);} if(r<=0){ clearInterval(S.timer); submit(true);} }
function renderQ(){

  h+='<main class="page"><div class="card"><div class="muted small" style="font-weight:700">प्रश्न '+(S.cur+1)+' / '+n+' · '+done+' हल किए</div><div class="qtext">'+fmt(q.q)+'</div><div class="opts">';
  S.optOrder[qi].forEach(function(oi,k){ h+='<button class="opt'+(S.answers[qi]===oi?' sel':'')+'" data-o="'+oi+'"><b>'+'ABCDE'[k]+'</b><span>'+fmt(q.o[oi])+'</span></button>'; });
  h+='</div><div class="qnav"><button class="btn ghost" id="pv"'+(S.cur===0?' disabled':'')+'>पिछला</button><button class="btn ghost" id="mk">'+(S.marks[qi]?'Unmark':'Review')+'</button><button class="btn" id="nx">'+(S.cur===n-1?'अंतिम':'अगला')+'</button></div>'
    +'<div class="row" style="margin-top:8px"><button class="btn ghost" id="cl" style="min-height:38px;padding:6px 12px">उत्तर हटाएं</button></div></div>';
  h+='<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="legend"><span style="--c:var(--green-d)">हल किया</span><span style="--c:var(--gold)">Review</span><span style="--c:var(--line)">बाकी</span></div><div class="pal">';
  S.order.forEach(function(qq,k){ h+='<button data-g="'+k+'" class="'+(S.answers[qq]!==undefined?'ans ':'')+(S.marks[qq]?'mark ':'')+(k===S.cur?'cur':'')+'">'+(k+1)+'</button>'; });
  h+='</div></div></main>';

function confirmSubmit(){
  var n=S.order.length, done=Object.keys(S.answers).length, o=document.createElement('div'); o.className='overlay';
  o.innerHTML='<div class="card" style="display:flex;flex-direction:column;gap:12px"><b>टेस्ट submit करें?</b><p style="margin:0" class="muted">आपने '+done+' / '+n+' प्रश्न हल किए हैं। '+(n-done)+' बाकी हैं।</p><div class="row"><button class="btn gold" id="cY">हाँ, submit करें</button><button class="btn ghost" id="cN">वापस</button></div></div>';
  document.body.appendChild(o);
  o.querySelector('#cN').onclick=function(){ o.remove(); };
  o.querySelector('#cY').onclick=function(){ o.remove(); submit(false); };
}
function submit(auto){
  clearInterval(S.timer);
  var t=S.test, c=0,w=0,s=0;
  t.questions.forEach(function(q,i){ var a=S.answers[i]; if(a===undefined||a===null) s++; else if(Number(a)===q.a) c++; else w++; });
  var p=profile();
  var res={id:Date.now(),testId:t.id,title:t.title,name:p.name,mobile:p.mobile,score:Math.round((c*TM(t)-w*TN(t))*100)/100,max:maxMarks(t),correct:c,wrong:w,skipped:s,
    timeTaken:Math.round((Date.now()-S.start)/1000),when:now(),answers:S.answers,auto:!!auto};
  var at=attempts(); at.push(res); if(at.length>200) at=at.slice(-200); set('attempts',at); del('progress'); hit('tests-submitted');
  setNav(true); review(res, true);
  if(CONFIG.backendUrl){
    api({action:'submit'},{testId:t.id,title:t.title,name:p.name,mobile:p.mobile,score:res.score,max:res.max,correct:c,wrong:w,skipped:s,timeTaken:res.timeTaken,answers:S.answers})
      .then(function(r){ var el=document.getElementById('rank'); if(el && r.rank) el.innerHTML='<b style="color:var(--gold)">Rank '+r.rank+' / '+r.total+'</b>'+(r.attemptNo>1?' <span class="muted small">(leaderboard में पहला attempt गिना जाता है)</span>':''); })
      .catch(function(){ var el=document.getElementById('rank'); if(el) el.innerHTML='<span class="muted small">Leaderboard अभी अपडेट नहीं हो पाया, बाद में देखें।</span>'; });
  }
}

/* ================= Result + Review ================= */
function review(res, fresh){
  activeTab('tests');
  if(!res){ return tests(); }
  var t=testById(res.testId), pct=Math.round(res.score/res.max*100), acc=(res.correct+res.wrong)?Math.round(res.correct/(res.correct+res.wrong)*100):0;
  var msg = pct>=80?'शानदार! आप टॉपर्स की लिस्ट में हैं।':pct>=60?'बहुत अच्छा! थोड़ी और मेहनत से टॉप पर पहुँचेंगे।':pct>=40?'ठीक है, गलत प्रश्नों को ध्यान से दोहराएँ।':'घबराएँ नहीं, eBook पढ़कर दोबारा कोशिश करें।';
  var h=topbar()+'<main class="page"><div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="score"><div class="ring" style="--p:'+Math.max(0,pct)+'"><div><span><b>'+res.score+'</b><small>/ '+res.max+'</small></span></div></div><div style="flex:1;min-width:160px"><b>'+esc(shortTitle(t))+' · '+esc(res.name)+'</b><div class="muted small">'+esc(res.when)+' · समय '+mmss(res.timeTaken)+'</div><div id="rank" class="small" style="margin-top:4px">'+(CONFIG.backendUrl&&fresh?'<span class="muted">Rank निकाली जा रही है...</span>':'')+'</div><p style="margin:6px 0 0">'+msg+'</p></div></div>'
    +'<div class="stats4"><div class="stat"><b style="color:var(--ok)">'+res.correct+'</b><span>सही</span></div><div class="stat"><b style="color:var(--bad)">'+res.wrong+'</b><span>गलत</span></div><div class="stat"><b style="color:var(--warn)">'+res.skipped+'</b><span>छोड़े</span></div><div class="stat"><b>'+acc+'%</b><span>Accuracy</span></div></div>'
    +'<div class="grid2"><a class="btn" style="text-align:center;text-decoration:none;display:grid;place-items:center" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent('🌾 Agrikranti '+shortTitle(t)+'\nनाम: '+res.name+'\nअंक: '+res.score+'/'+res.max+' ('+pct+'%)\nसही '+res.correct+' | गलत '+res.wrong+' | छोड़े '+res.skipped+'\nसमय: '+mmss(res.timeTaken)+'\n\nAgrikranti पर टेस्ट दें: '+APP_URL)+'">WhatsApp पर भेजें</a>'
    +(CONFIG.backendUrl?'<button class="btn gold" data-lb="'+t.id+'">Leaderboard</button>':'<button class="btn gold" data-start="'+t.id+'">फिर से दें</button>')+'</div></div>';
  h+=shareCard();
  h+='<h2 class="sec">उत्तर और <span>व्याख्या</span></h2>';
  t.questions.forEach(function(q,i){
    var a=res.answers[i], ch=(a===undefined||a===null)?null:Number(a), cls=ch===null?'skip':(ch===q.a?'ok':'bad'), tag=ch===null?'छोड़ा':(ch===q.a?'सही':'गलत');
    h+='<div class="rv '+cls+'"><p><span class="tag '+cls+'">Q'+(i+1)+' · '+tag+'</span></p><p><b>'+fmt(q.q)+'</b></p>'+(ch!==null&&ch!==q.a?'<p>आपका उत्तर: <span style="color:var(--bad)">'+fmt(q.o[ch])+'</span></p>':'')
      +'<p>सही उत्तर: <b style="color:var(--ok)">'+fmt(q.o[q.a])+'</b></p><p class="exp">'+fmt(q.e)+'</p></div>';
  });
  h+='<button class="btn ghost block" data-go2="tests">सभी टेस्ट</button></main>';
  app.innerHTML=h; bindCommon();
}

/* ================= eBooks ================= */
function unlocked(){ return get('unlocked',{}); }
function sha256hex(t){ if(!(window.crypto&&crypto.subtle)) return Promise.reject(new Error('nosubtle'));
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){ return Array.from(new Uint8Array(b)).map(function(x){return ('0'+x.toString(16)).slice(-2);}).join(''); }); }
function isOpen(b){ var u=unlocked()[b.id]; return !b.price || (u && (u.c||u.k)); }
function autoPay(){ return !!(CONFIG.rzpKey && CONFIG.payUrl); }
function ebookCard(b){
  var open=isOpen(b);
  var readBtn=b.pack?'<button class="btn" data-read="'+b.id+'">📚 Papers खोलें</button>':b.price?'<button class="btn" data-read="'+b.id+'">📖 पढ़ें</button>':'<a class="btn" style="text-decoration:none;display:inline-grid;place-items:center" target="_blank" rel="noopener" href="'+esc(b.file)+'">पढ़ें / डाउनलोड</a>';
  return '<div class="card ebook"><div class="cover"><span>'+b.cover+'</span><small>Agrikranti</small></div><div style="flex:1;min-width:0"><b>'+esc(b.title)+'</b><div class="muted small" style="margin:2px 0 8px">'+esc(b.sub)+' · '+b.pages+' पेज</div>'
    +'<div class="chips">'+(b.price?(open?'<span class="chip done">✔ खरीदी हुई</span>':'<span class="chip" style="color:var(--gold)">₹'+b.price+'</span>'):'<span class="chip done">Free</span>')+(b.price?'<span class="chip">🔒 सिर्फ App में पढ़ें</span>':'')+'</div>'
    +'<div class="row">'+(open?readBtn:'<button class="btn gold" data-buy="'+b.id+'">₹'+b.price+' में खरीदें</button>'+(b.enc?'<button class="btn ghost" data-code="'+b.id+'">'+(autoPay()?'पहले खरीदी है?':'🔑 Password डालें')+'</button>':''))+'</div></div></div>';
}

/* ===== Automatic payment (Razorpay) ===== */
function payApi(body){ return fetch(CONFIG.payUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){ return r.json(); }); }
function loadRzp(){ if(window.Razorpay) return Promise.resolve(); return new Promise(function(res,rej){ var sc=document.createElement('script'); sc.src='https://checkout.razorpay.com/v1/checkout.js'; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); }); }
function grant(b,m,key,pid,name){ var u=unlocked(); u[b.id]={m:m,k:key,p:pid}; set('unlocked',u); if(name && !profile()) set('profile',{name:name,mobile:m}); hit('book-unlocks'); ebooks(); openReader(b.id); }
function payForm(b){
  var p=profile()||{}, o=document.createElement('div'); o.className='overlay';
  o.innerHTML='<form class="card" id="pf2" style="display:flex;flex-direction:column;gap:10px"><div class="row" style="justify-content:space-between"><b>'+(b.pack?'Semester Pack':'eBook')+' खरीदें - ₹'+b.price+'</b><button class="iconbtn" type="button" id="px">✕</button></div><div class="muted small">'+esc(b.title)+'</div>'
   +'<label class="small" for="pn2">आपका नाम</label><input id="pn2" maxlength="40" value="'+esc(p.name||'')+'">'
   +'<label class="small" for="pm2">मोबाइल नंबर</label><input id="pm2" inputmode="numeric" maxlength="10" value="'+esc(p.mobile||'')+'">'
   +'<div class="muted small">UPI, PhonePe, GPay, Card या Net Banking से pay करें। Payment होते ही book इसी app में अपने आप खुल जाएगी।</div>'
   +'<div class="err" id="pe2"></div><button class="btn gold block" type="submit" id="pb2">₹'+b.price+' Pay करें</button><div class="muted small" style="text-align:center">🔒 सुरक्षित payment</div></form>';
  document.body.appendChild(o);
  o.querySelector('#px').onclick=function(){ o.remove(); };
  o.querySelector('#pf2').onsubmit=function(e){ e.preventDefault();
    var n=o.querySelector('#pn2').value.replace(/\s+/g,' ').trim(), m=o.querySelector('#pm2').value.replace(/\D/g,''), er=o.querySelector('#pe2'), btn=o.querySelector('#pb2');

    btn.disabled=true; er.className='muted small'; er.textContent='Payment खुल रहा है...';
    Promise.all([loadRzp(),payApi({action:'order',book:b.id,mobile:m,name:n})]).then(function(r){
      var od=r[1]; if(!od.order_id) throw new Error(od.error||'order');
      o.remove();
      var rz=new Razorpay({key:od.key_id||CONFIG.rzpKey,amount:od.amount,currency:'INR',order_id:od.order_id,name:'Agrikranti 1928',description:b.title,image:location.href.replace(/[^/]*$/,'')+'icons/icon-192.png',
        prefill:{name:n,contact:m},notes:{book:b.id,mobile:m},theme:{color:'#1f8f3a'},

          payApi({action:'verify',book:b.id,mobile:m,name:n,order_id:resp.razorpay_order_id,payment_id:resp.razorpay_payment_id,signature:resp.razorpay_signature})
            .then(function(v){ w.remove(); if(!v.ok||!v.key) throw new Error(v.error||'verify'); grant(b,m,v.key,resp.razorpay_payment_id,n); })
            .catch(function(){ w.innerHTML='<div class="card"><b>Payment हो गया, पर book अभी नहीं खुली</b><p class="muted small">घबराएँ नहीं, पैसा सुरक्षित है। Payment ID: <b>'+esc(resp.razorpay_payment_id)+'</b><br>"पहले खरीदी है?" में मोबाइल नंबर और यह Payment ID डालें, या Telegram पर screenshot भेजें।</p><button class="btn" onclick="this.closest(\'.overlay\').remove()">ठीक है</button></div>'; });
        }});
      rz.on('payment.failed',function(){ alert('Payment नहीं हुआ। दोबारा कोशिश करें।'); });

      er.textContent='Payment अभी शुरू नहीं हो पाया। '+(/Failed to fetch|NetworkError|Load failed/i.test(m)?'(Server नहीं खुला - Script का Deploy "Anyone" के लिए है?)':m&&m!=='order'?'Error: '+m.slice(0,220):'इंटरनेट जाँचकर दोबारा कोशिश करें।'); });
  };

function codeBox(id,pm,pc){
  var b=EBOOKS.filter(function(e){return e.id===id;})[0], p=profile()||{};
  var o=document.createElement('div'); o.className='overlay';
  o.innerHTML='<form class="card" id="cf" style="display:flex;flex-direction:column;gap:10px"><b>🔑 Password डालें</b><div class="muted small">'+esc(b.title)+'</div>'

   +'<label for="cc" class="small">Password = आपकी जन्मतिथि (DDMMYYYY)</label><input id="cc" autocomplete="off" value="'+esc(pc||'')+'" placeholder="जैसे 19/07/2001 → 19072001" style="text-transform:uppercase">'
   +'<div class="err" id="ce"></div><div class="row"><button class="btn" type="submit" id="cs">Unlock करें</button><button class="btn ghost" type="button" id="cx">रद्द करें</button></div></form>';
  document.body.appendChild(o);
  o.querySelector('#cx').onclick=function(){ o.remove(); };
  o.querySelector('#cf').onsubmit=function(e){ e.preventDefault();
    var m=o.querySelector('#cm').value.replace(/\D/g,''), c=o.querySelector('#cc').value.toUpperCase().replace(/[^A-Z0-9]/g,''), er=o.querySelector('#ce'), btn=o.querySelector('#cs');

    btn.disabled=true; er.className='muted small'; er.textContent='जाँच हो रही है...';
    fetch('content.json?v='+Date.now(),{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(cj){ window.LIC=cj.licenses||{}; window.BPASS=cj.bookPass||{}; }).catch(function(){})
     .then(function(){ return AK.licId(b.id,m,c); })
     .then(function(lid){ var w=(LIC[b.id]||{})[lid]; if(w) return AK.licUnwrap(w.w||w,b.id,m,c).then(function(K){ return {K:K,lic:1}; });

function toks(t){ return normTxt(t).split(/\s+/).filter(function(w){ return w.length>1 && !STOP[w]; }); }
function buildKB(){
  KB=[]; var df={};
  TESTS.forEach(function(t){ t.questions.forEach(function(q){ var tk=toks(q.q+' '+q.o[q.a]+' '+q.e), u={}; tk.forEach(function(w){ u[w]=1; }); Object.keys(u).forEach(function(w){ df[w]=(df[w]||0)+1; }); KB.push({q:q.q,a:q.o[q.a],e:q.e,set:u,t:shortTitle(t)}); }); });

function searchKB(query,n){
  if(!KB) buildKB(); var qt=toks(query), N=KB.length; if(!qt.length) return [];
  return KB.map(function(k){ var sc=0, hitN=0; qt.forEach(function(w){ if(k.set[w]){ sc+=Math.log(1+N/(KB.df[w]||1)); hitN++; } else if(w.length>4){ for(var x in k.set){ if(x.length>4 && (x.indexOf(w)===0||w.indexOf(x)===0)){ sc+=0.5*Math.log(1+N/(KB.df[x]||1)); hitN+=0.5; break; } } } }); var cov=hitN/qt.length; return {k:k,s:sc*cov,c:cov}; })
    .filter(function(r){ return r.s>1.5 && r.c>=(qt.length>1?0.6:1); }).sort(function(a,b){ return b.s-a.s; }).filter(function(r,i,arr){ return r.s>=arr[0].s*0.6; }).slice(0,n||4).map(function(r){ return r.k; });
}
function mdLite(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#+\s*(.+)$/gm,'<b>$1</b>').replace(/^\s*[-*•]\s+(.+)$/gm,'• $1').replace(/(\d+)\^(\d+)/g,'$1<sup>$2</sup>').replace(/\n/g,'<br>'); }
function factsHtml(fs){ return fs.map(function(f){ return '<div class="fact">'+fmt(f.q)+'<br><span class="ans">✔ '+fmt(f.a)+'</span><div class="muted small">'+fmt(f.e)+'</div></div>'; }).join(''); }
var AI_SYS='आप "Agrikranti AI" हैं, जिसे Agrikranti 1928 (Aditya Kumar, M.Sc. Soil Science, Gold Medalist) ने agriculture छात्रों के लिए बनाया है। छात्र B.Sc. Agriculture, ICAR UG/PG/JRF, UPCATET, UPSSSC AGTA, Sugarcane Supervisor जैसी परीक्षाओं की तैयारी कर रहे हैं। जवाब आसान हिंदी (देवनागरी) में दें, तकनीकी शब्द English में रखें। पहले सीधा उत्तर, फिर 3 - 6 बुलेट में मुख्य बिंदु (वैज्ञानिक, वर्ष, संख्या जहाँ उपयोगी)। सिर्फ **bold** और - बुलेट इस्तेमाल करें, तालिका नहीं। पक्का न हो तो लिखें "इसे किताब से मिला लें", कुछ भी गढ़ें नहीं। दिए गए "Agrikranti notes के तथ्य" प्रश्न से जुड़े हों तो उन्हें प्राथमिकता दें। पढ़ाई/agriculture से बाहर के प्रश्न पर विनम्रता से मना करें। अपने बारे में पूछने पर बस बताएं कि आप Agrikranti AI हैं; किसी company, model, Google या Gemini का नाम न लें।';
var AI_MODELS=['gemini-2.5-flash','gemini-2.0-flash','gemini-flash-latest','gemini-2.5-flash-lite'];
var AI_LASTERR='', AI_GOOD=null;
function gFetch(url,body){
  // pehle header se key, na chale to ?key= se
  var opt=function(h){ return {method:body?'POST':'GET',headers:h,body:body?JSON.stringify(body):undefined}; };
  return fetch(url,opt(body?{'Content-Type':'application/json','x-goog-api-key':CONFIG.geminiKey}:{'x-goog-api-key':CONFIG.geminiKey}))
    .then(function(r){ return r.json(); })
    .catch(function(e){ return fetch(url+(url.indexOf('?')<0?'?':'&')+'key='+encodeURIComponent(CONFIG.geminiKey),opt(body?{'Content-Type':'application/json'}:{})).then(function(r){ return r.json(); }); });
}
function aiModelList(){
  if(AI_GOOD) return Promise.resolve([AI_GOOD].concat(AI_MODELS));
  return gFetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200').then(function(j){
    if(j.error){ AI_LASTERR=(j.error.status||'')+' '+(j.error.message||''); }
    var names=(j.models||[]).filter(function(m){ return (m.supportedGenerationMethods||[]).indexOf('generateContent')>=0 && /flash/.test(m.name) && !/image|tts|audio|live|thinking|embedding/.test(m.name); })
      .map(function(m){ return m.name.replace('models/',''); });
    names.sort(function(a,b){ var sa=(/lite/.test(a)?1:0)+(/preview|exp/.test(a)?2:0), sb=(/lite/.test(b)?1:0)+(/preview|exp/.test(b)?2:0); return sa-sb || b.localeCompare(a); });
    var all=(names.length?names.filter(function(n){ return AI_MODELS.indexOf(n)>=0; }).concat(names):[]).concat(AI_MODELS); return all.filter(function(x,k){ return all.indexOf(x)===k; });
  }).catch(function(){ return AI_MODELS; });
}
function callGemini(q,past,ctx){
  var contents=past.map(function(m){ return {role:m.role,parts:[{text:m.text}]}; });
  contents.push({role:'user',parts:[{text:(ctx?'Agrikranti notes के तथ्य (संदर्भ):\n'+ctx+'\n\n':'')+'प्रश्न: '+q}]});
  var body={systemInstruction:{parts:[{text:AI_SYS}]},contents:contents,generationConfig:{temperature:0.4,maxOutputTokens:1200}};
  return aiModelList().then(function(models){
    function tryM(k){
      if(k>=models.length||k>=8) return Promise.reject(new Error(AI_LASTERR||'no model'));
      return gFetch('https://generativelanguage.googleapis.com/v1beta/models/'+models[k]+':generateContent',body).then(function(j){
        var t=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts?j.candidates[0].content.parts.map(function(p){return p.text||'';}).join(''):'';
        if(t){ AI_GOOD=models[k]; return t; }
        AI_LASTERR=j.error?((j.error.status||j.error.code||'')+' '+(j.error.message||'')):'empty answer ('+models[k]+')';
        if(j.error&&(j.error.code===400||j.error.code===401||j.error.code===403)&&/key|API_KEY|permission|PERMISSION/i.test(AI_LASTERR)) return Promise.reject(new Error(AI_LASTERR));
        return tryM(k+1);
      }).catch(function(e){ if(!AI_LASTERR) AI_LASTERR=String(e&&e.message||e); return /key|permission/i.test(AI_LASTERR)?Promise.reject(e):tryM(k+1); });
    }
    return tryM(0);
  });
}
function askAI(){
  activeTab('');
  var hist=get('aichat',[]);
  var h=topbar()+'<main class="page"><section class="hero" style="padding:14px"><div style="font-size:40px">✨</div><div><h1 style="font-size:30px">Agrikranti AI</h1><p>Agriculture का कोई भी प्रश्न पूछें - Soil, Agronomy, Horticulture, Breeding, Plant Protection, Schemes...</p></div></section>';
  h+='<div class="chat" id="chat"></div>';
  h+='<div class="sugg" id="sugg">'+['Vertisols की विशेषताएँ बताओ','Rhizobium के बारे में बताओ','Tetrazolium test क्या है?','Leaf Colour Chart','Land capability classes'].map(function(x){ return '<button>'+esc(x)+'</button>'; }).join('')+'</div>';
  h+='<form class="askbar" id="af"><textarea id="aq" placeholder="अपना प्रश्न यहाँ लिखें..." maxlength="600"></textarea><button class="btn gold" type="submit">भेजें</button></form>';
  h+='<div class="row" style="justify-content:space-between"><span class="muted small">'+((CONFIG.aiUrl||CONFIG.geminiKey)?'AI जवाब + app के प्रश्नों से तथ्य':'अभी app के 500+ प्रश्नों और व्याख्याओं से जवाब')+'</span><button class="iconbtn" id="clr">Chat साफ करें</button></div>';
  h+='<div class="muted small">AI गलती कर सकता है, ज़रूरी तथ्य किताब/notes से मिला लें।</div></main>';
  app.innerHTML=h; bindCommon();
  var chat=document.getElementById('chat');
  function add(cls,html){ var d=document.createElement('div'); d.className='msg '+cls; d.innerHTML=html; chat.appendChild(d); d.scrollIntoView({block:'end',behavior:'smooth'}); return d; }
  if(!hist.length) add('ai','नमस्ते! 🌾 मैं <b>Agrikranti AI</b> हूँ। Agriculture exam से जुड़ा कोई भी प्रश्न पूछिए, मैं आसान हिंदी में समझाऊँगा।');
  hist.forEach(function(m){ add(m.r==='u'?'me':'ai', m.r==='u'?esc(m.t):m.h); });
  function send(q){
    q=q.trim(); if(!q) return; document.getElementById('aq').value=''; document.getElementById('sugg').hidden=true;
    add('me',esc(q)); hist.push({r:'u',t:q}); hit('ai-questions');
    var facts=searchKB(q,4), wait=add('ai','<span class="dots"><span></span><span></span><span></span></span>');
    function finish(html){ html+='<div style="margin-top:6px;text-align:right"><a class="muted small" style="color:var(--muted)" target="_blank" rel="noopener" href="https://t.me/share/url?url='+encodeURIComponent(APP_URL)+'&text='+encodeURIComponent('Agrikranti AI का यह जवाब गलत / आपत्तिजनक है - प्रश्न: '+q)+'">⚑ गलत / आपत्तिजनक जवाब रिपोर्ट करें</a></div>'; wait.innerHTML=html; hist.push({r:'a',h:html}); if(hist.length>40) hist=hist.slice(-40); set('aichat',hist); wait.scrollIntoView({block:'end',behavior:'smooth'}); }
    var fh=facts.length?'<div class="muted small" style="margin-top:8px"><b>📘 Agrikranti प्रश्नों से जुड़े तथ्य:</b></div>'+factsHtml(facts):'';
    if(!CONFIG.aiUrl && !CONFIG.geminiKey){
      finish((facts.length?'<b>आपके प्रश्न से जुड़े तथ्य (Agrikranti notes से):</b>'+factsHtml(facts):'इस प्रश्न से जुड़ा तथ्य अभी app के प्रश्नों में नहीं मिला।')+'<div class="muted small" style="margin-top:8px">🔧 Agrikranti AI का पूरा जवाब वाला feature जल्द चालू हो रहा है। तब तक doubt Telegram पर भेजें।</div>');
      return;
    }
    var past=hist.slice(-7,-1).map(function(m){ return {role:m.r==='u'?'user':'model',text:m.r==='u'?m.t:String(m.h).replace(/<[^>]+>/g,' ').slice(0,600)}; });
    var ctx=facts.map(function(f){ return 'Q: '+f.q+' | उत्तर: '+f.a+' | '+f.e; }).join('\n');
    if(!CONFIG.aiUrl){
      callGemini(q,past,ctx).then(function(t){ finish(mdLite(t)+fh); })
        .catch(function(e){ var why=String(e&&e.message||AI_LASTERR||'').slice(0,160); finish('AI अभी जवाब नहीं दे पाया। '+(facts.length?'तब तक ये तथ्य देखें:'+factsHtml(facts):'थोड़ी देर बाद दोबारा पूछें।')+'<div class="muted small" style="margin-top:6px;font-size:11px">कोड: '+esc(why||'network')+'</div>'); });
      return;
    }
    var ctl=new AbortController(), to=setTimeout(function(){ ctl.abort(); },30000);
    fetch(CONFIG.aiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({q:q,history:past,context:ctx}),signal:ctl.signal})
      .then(function(r){ return r.json(); }).then(function(j){ clearTimeout(to); if(!j.answer) throw new Error(j.error||'empty'); finish(mdLite(j.answer)+fh); })
      .catch(function(){ clearTimeout(to); finish('AI अभी जवाब नहीं दे पाया (इंटरनेट या सर्वर व्यस्त)। '+(facts.length?'तब तक ये तथ्य देखें:'+factsHtml(facts):'थोड़ी देर बाद दोबारा पूछें।')); });
  }
  document.getElementById('af').onsubmit=function(e){ e.preventDefault(); send(document.getElementById('aq').value); };
  document.getElementById('aq').onkeydown=function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(this.value); } };
  document.querySelectorAll('#sugg button').forEach(function(b){ b.onclick=function(){ send(b.textContent); }; });
  document.getElementById('clr').onclick=function(){ del('aichat'); askAI(); };
}

  app.innerHTML=topbar()+'<main class="page"><form class="card" id="af" style="display:flex;flex-direction:column;gap:12px"><h2 class="sec" style="margin:0">Admin <span>Panel</span></h2><div><label for="ak">Admin password</label><input id="ak" type="password"></div><div class="err" id="ae"></div><button class="btn" type="submit">Login</button></form></main>';
  document.getElementById('af').onsubmit=function(e){ e.preventDefault(); var k=document.getElementById('ak').value;
    api({action:'admin',key:k}).then(function(d){ adminView(d,k); }).catch(function(m){ document.getElementById('ae').textContent=m.message||'Login नहीं हुआ'; }); };
}
function adminView(d,key){
  var filt='',q='';
  function draw(){
    var rows=d.rows.filter(function(r){ return (!filt||r.testId===filt)&&(!q||(r.name+' '+r.mobile).toLowerCase().indexOf(q)>=0); });
    var st={}; rows.forEach(function(r){ st[r.mobile]=1; });
    var avg=rows.length?(rows.reduce(function(s,r){return s+Number(r.score);},0)/rows.length).toFixed(1):0;
    var h='<div class="stats4"><div class="stat"><b>'+rows.length+'</b><span>Attempts</span></div><div class="stat"><b>'+Object.keys(st).length+'</b><span>छात्र</span></div><div class="stat"><b>'+avg+'</b><span>औसत</span></div><div class="stat"><b>'+(rows.length?Math.max.apply(null,rows.map(function(r){return Number(r.score);})):0)+'</b><span>Top</span></div></div><div class="tbl"><table><thead><tr><th>समय</th><th>Test</th><th>नाम</th><th>मोबाइल</th><th>अंक</th><th>सही</th><th>गलत</th><th>समय</th><th>#</th></tr></thead><tbody>';
    rows.forEach(function(r){ h+='<tr><td>'+esc(r.ts)+'</td><td>'+esc(r.testId)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.mobile)+'</td><td class="num">'+r.score+'/'+r.max+'</td><td class="num">'+r.correct+'</td><td class="num">'+r.wrong+'</td><td class="num">'+mmss(r.time)+'</td><td class="num">'+r.attempt+'</td></tr>'; });
    document.getElementById('out').innerHTML=h+'</tbody></table></div>';
  }
  var opts='<option value="">सभी टेस्ट</option>'+TESTS.map(function(t){return '<option value="'+t.id+'">'+esc(shortTitle(t))+'</option>';}).join('');
  app.innerHTML=topbar()+'<main class="page"><h2 class="sec">Admin <span>Panel</span></h2><div class="grid2"><select id="ft" style="padding:12px;border-radius:12px;background:var(--bg2);color:var(--ink);border:1.5px solid var(--line);font:inherit">'+opts+'</select><input id="sq" placeholder="नाम / मोबाइल खोजें"></div><div id="out" style="display:flex;flex-direction:column;gap:12px"></div><button class="btn ghost" id="rl">Refresh</button><p class="muted small">पूरा डेटा Google Sheet "Results" में भी है।</p></main>';
  document.getElementById('ft').onchange=function(e){ filt=e.target.value; draw(); };
  document.getElementById('sq').oninput=function(e){ q=e.target.value.toLowerCase(); draw(); };
  document.getElementById('rl').onclick=function(){ api({action:'admin',key:key}).then(function(nd){ d=nd; draw(); }); };
  draw();
}

function iosInstallHelp(force){

    var ua=navigator.userAgent||'', ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(!ios) return false;
    if(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)) return false;
    if(!force){ var t=+get('iosHelpT',0); if(Date.now()-t<3*864e5) return false; }
    if(document.getElementById('iosHelp')) return true;
    var inApp=/FBAN|FBAV|Instagram|WhatsApp|Telegram|Line\/|; wv\)|GSA\//i.test(ua);
    var o=document.createElement('div'); o.id='iosHelp';
    o.style.cssText='position:fixed;left:10px;right:10px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:9999;background:#111a14;border:2px solid var(--gold);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1.5';
    o.innerHTML='<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><img src="icons/apple-touch-icon.png" alt="" style="width:40px;height:40px;border-radius:10px"><b style="flex:1;font-size:16px">iPhone में Agrikranti ऐप इंस्टॉल करें</b><button id="iosX" aria-label="बंद करें" style="background:none;border:0;color:#aaa;font-size:26px;line-height:1">×</button></div>'
      +(inApp?'<div>यह पेज WhatsApp / Instagram के अंदर खुला है। ऊपर या नीचे <b>⋯ / Share</b> दबाकर <b>"Open in Safari"</b> चुनें, फिर Safari में नीचे दिए स्टेप करें।</div>':'')
      +'<ol style="margin:6px 0 0;padding-left:20px"><li>नीचे <b>Share</b> बटन <span style="display:inline-block;border:1.5px solid #8fd;border-radius:5px;padding:0 6px">⬆</span> दबाएँ</li><li>नीचे स्क्रॉल करके <b>"Add to Home Screen"</b> (होम स्क्रीन में जोड़ें) चुनें</li><li>ऊपर दाईं ओर <b>Add</b> दबाएँ - होम स्क्रीन पर Agrikranti ऐप आ जाएगा</li></ol>';
    document.body.appendChild(o);
    document.getElementById('iosX').onclick=function(){ set('iosHelpT',Date.now()); o.remove(); };
    return true;
  }catch(e){ return false; }
}
