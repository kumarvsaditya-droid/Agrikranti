name: Build Android (Play Store)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'android-admin/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build TWA with Bubblewrap
        run: |
          bash android/build.sh android Agrikranti > build.log 2>&1 || (echo "BUILD FAILED" >> build.log)
          bash android/build.sh android-admin AgrikrantiAdmin > build-admin.log 2>&1 || (echo "BUILD FAILED" >> build-admin.log)
      - name: Save outputs to android-build branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -f *.log Agrikranti*.apk Agrikranti*.aab /tmp/out/ 2>/dev/null || true
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan android-build
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/out/* . ; rm -rf work 2>/dev/null || true
          echo "Built from ${GITHUB_SHA}" > BUILD.txt
          git add -A && git commit -m "Android build ${GITHUB_SHA}" && git push -f origin android-build
