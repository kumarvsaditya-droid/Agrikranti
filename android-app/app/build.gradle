plugins { id 'com.android.application' }
android {
    namespace 'com.agrikranti1928.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.agrikranti1928.app'
        minSdk 24
        targetSdk 34
        versionCode = Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '2')
        versionName '2.0.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KS_PATH') ?: 'release.keystore')
            storePassword System.getenv('KS_PASS') ?: 'testpass123'
            keyAlias System.getenv('KS_ALIAS') ?: 'agrikranti'
            keyPassword System.getenv('KS_PASS') ?: 'testpass123'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.core:core:1.13.1' }
